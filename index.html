<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>보상 MBTI · 나를 춤추게 하는 보상은?</title>
<style>
  :root {
    --bg1: #6a5cff;
    --bg2: #ff6ba6;
    --card: #ffffff;
    --ink: #23204a;
    --muted: #6b6890;
    --accent: #6a5cff;
    --accent2: #ff5c8a;
    --soft: #f2f1ff;
    --shadow: 0 18px 50px rgba(60, 40, 120, 0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }
  .wrap { width: 100%; max-width: 480px; }
  .card {
    background: var(--card);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 30px 26px 28px;
    position: relative;
    overflow: hidden;
  }
  .screen { display: none; }
  .screen.active { display: block; animation: pop .35s ease; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .badge {
    display: inline-block;
    background: var(--soft);
    color: var(--accent);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .5px;
    padding: 7px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 30px;
    line-height: 1.3;
    margin: 0 0 12px;
    font-weight: 900;
    letter-spacing: -1px;
  }
  h1 .hl {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lead { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .emoji-row { font-size: 34px; text-align: center; margin: 6px 0 22px; letter-spacing: 6px; }

  label.fld { display:block; font-size:13px; font-weight:800; color:var(--muted); margin:0 0 8px 2px; }
  .name-input {
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    border: 2px solid #ece9ff;
    background: #fbfaff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 8px;
    outline: none;
    transition: border-color .12s ease, background .12s ease;
  }
  .name-input:focus { border-color: var(--accent); background: #fff; }
  .err { color: var(--accent2); font-size: 13px; font-weight: 700; min-height: 18px; margin: 0 0 12px 2px; }

  .btn {
    display: block;
    width: 100%;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    padding: 17px;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(106, 92, 255, .35);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active { transform: translateY(2px) scale(.99); box-shadow: 0 5px 14px rgba(106,92,255,.3); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn.ghost { background: var(--soft); color: var(--accent); box-shadow: none; }
  .note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
  .link {
    display:block; text-align:center; margin-top:16px;
    color:var(--muted); font-size:13px; font-weight:700; text-decoration:none;
  }
  .link:hover { color: var(--accent); }

  .progress-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .qcount { font-size:13px; font-weight:800; color:var(--muted); }
  .bar { flex:1; height:8px; background:var(--soft); border-radius:999px; margin-left:12px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px; transition:width .3s ease; }
  .q-emoji { font-size:42px; text-align:center; margin:10px 0 4px; }
  .q-text { font-size:21px; font-weight:800; text-align:center; margin:4px 0 24px; letter-spacing:-.5px; }
  .opt {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:2px solid #ece9ff; background:#fbfaff; border-radius:16px; padding:16px;
    margin-bottom:12px; font-family:inherit; font-size:16px; font-weight:700; color:var(--ink);
    cursor:pointer; transition:border-color .12s ease, transform .1s ease, background .12s ease;
  }
  .opt:active { transform: scale(.98); }
  .opt:hover { border-color: var(--accent); background:#fff; }
  .opt .ic { font-size:24px; flex-shrink:0; }
  .back {
    display:inline-block; margin-top:6px; background:none; border:none; color:var(--muted);
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; padding:8px 4px;
  }

  .done-emoji { font-size:64px; text-align:center; margin:8px 0 6px; }
  .done-title { text-align:center; font-size:24px; font-weight:900; letter-spacing:-1px; margin:0 0 8px; }
  .done-sub { text-align:center; color:var(--muted); font-size:15px; margin:0 0 24px; }

  .r-emoji { font-size:70px; text-align:center; line-height:1; margin:4px 0 8px; }
  .r-hello { text-align:center; font-size:14px; font-weight:800; color:var(--muted); margin-bottom:4px; }
  .r-code { text-align:center; font-weight:900; letter-spacing:3px; color:var(--accent); font-size:15px; margin-bottom:2px; }
  .r-name { text-align:center; font-size:27px; font-weight:900; letter-spacing:-1px; margin:0 0 6px; }
  .r-tag { text-align:center; color:var(--muted); font-size:15px; margin:0 0 20px; font-weight:600; }
  .r-desc { background:var(--soft); border-radius:16px; padding:16px 18px; font-size:15px; margin-bottom:16px; }
  .sect-title { font-size:14px; font-weight:900; color:var(--accent2); margin:0 0 8px; display:flex; align-items:center; gap:6px; }
  ul.pills { list-style:none; padding:0; margin:0 0 18px; }
  ul.pills li { background:#fff; border:2px solid #f0eeff; border-radius:12px; padding:11px 14px; font-size:14px; font-weight:600; margin-bottom:8px; }
  .r-axes { display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:20px; }
  .axis { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--muted); background:#fafaff; border-radius:10px; padding:8px 12px; }
  .axis .pole { flex:1; text-align:center; }
  .axis .pole.on { color:var(--accent); font-weight:900; }
  .axis .mid { font-size:10px; opacity:.5; }
  .match { display:flex; gap:10px; margin-bottom:20px; }
  .match > div { flex:1; border-radius:14px; padding:12px; text-align:center; font-size:13px; font-weight:700; }
  .match .good { background:#e9fbef; color:#17a04a; }
  .match .bad { background:#ffeef0; color:#e0466a; }
  .match .lbl { display:block; font-size:11px; opacity:.7; margin-bottom:3px; font-weight:800; }
  .save-state { text-align:center; font-size:12.5px; font-weight:700; margin:2px 0 14px; min-height:18px; }
  .save-state.ok { color:#17a04a; }
  .save-state.err { color:var(--accent2); }
  .save-state.pending { color:var(--muted); }
  .foot-note { text-align:center; color:var(--muted); font-size:12px; margin-top:16px; }
  .stack > * + * { margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <!-- INTRO / LANDING -->
    <section id="intro" class="screen active">
      <span class="badge">🎁 사내 아이스브레이킹용</span>
      <h1>나를 춤추게 하는<br><span class="hl">보상 유형</span>은?</h1>
      <p class="lead">12개 질문으로 나의 보상 성향 16유형을 찾아보세요. 결과는 자동으로 기록되어 팀원들과 비교해 볼 수 있어요!</p>
      <div class="emoji-row">💰 · 🌱 · 🏅 · 🎉</div>

      <label class="fld" for="nameInput">이름 (또는 닉네임)</label>
      <input id="nameInput" class="name-input" type="text" maxlength="20"
             placeholder="예: 김보상" autocomplete="off"
             onkeydown="if(event.key==='Enter')start()" oninput="clearErr()" />
      <p class="err" id="nameErr"></p>

      <button class="btn" onclick="start()">시작하기</button>
      <p class="note">약 1분 · 12문항 · 정답은 없어요</p>
      <a class="link" href="./records.html">📊 전체 기록 보기</a>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="screen">
      <div class="progress-top">
        <span class="qcount"><span id="qnow">1</span>/12</span>
        <span class="bar"><i id="barfill"></i></span>
      </div>
      <div class="q-emoji" id="qEmoji">💭</div>
      <div class="q-text" id="qText"></div>
      <div id="opts"></div>
      <button class="back" id="backBtn" onclick="goBack()" style="visibility:hidden">← 이전 질문</button>
    </section>

    <!-- DONE -->
    <section id="done" class="screen">
      <div class="done-emoji">🎊</div>
      <div class="done-title" id="doneTitle">다 풀었어요!</div>
      <p class="done-sub">이제 나의 보상 유형을 확인해 볼까요?</p>
      <button class="btn" id="revealBtn" onclick="reveal()">결과 보기 🎉</button>
      <button class="back" onclick="goBack()" style="display:block;margin:12px auto 0;">← 마지막 질문 다시 보기</button>
    </section>

    <!-- RESULT -->
    <section id="result" class="screen">
      <div class="r-emoji" id="rEmoji">🎯</div>
      <div class="r-hello" id="rHello"></div>
      <div class="r-code" id="rCode"></div>
      <h2 class="r-name" id="rName"></h2>
      <p class="r-tag" id="rTag"></p>
      <div class="save-state pending" id="saveState"></div>

      <div class="r-desc" id="rDesc"></div>

      <p class="sect-title">💗 이런 보상에 심장이 뜁니다</p>
      <ul class="pills" id="rLoves"></ul>

      <p class="sect-title">🧑‍💼 이 사람을 춤추게 하려면 (매니저 팁)</p>
      <div class="r-desc" id="rTip" style="background:#fff5f9;"></div>

      <p class="sect-title">🧭 나의 보상 좌표</p>
      <div class="r-axes" id="rAxes"></div>

      <div class="match">
        <div class="good"><span class="lbl">환상의 짝꿍</span><span id="rGood"></span></div>
        <div class="bad"><span class="lbl">티키타카 필요</span><span id="rBad"></span></div>
      </div>

      <div class="stack">
        <button class="btn" onclick="shareResult()">공유하기 📤</button>
        <button class="btn ghost" onclick="restart()">다시 하기 🔁</button>
      </div>
      <a class="link" href="./records.html">📊 전체 기록 보기</a>
    </section>

  </div>
</div>

<script>
// ===== 질문 정의 =====
// axis: 형태 M(실속)/E(가치), 타이밍 I(즉시)/A(축적), 대상 S(개인)/T(팀), 방식 P(공개)/Q(은근)
const QUESTIONS = [
  { e:"📈", q:"이번 분기 성과가 좋아서 보상을 받는다면?",
    a:{t:"통장에 꽂히는 두둑한 보너스", ic:"💰", k:"M"},
    b:{t:"배우고 싶던 강의·워크숍 지원", ic:"🌱", k:"E"} },
  { e:"🎁", q:"사내 경품 이벤트, 더 끌리는 상품은?",
    a:{t:"어디서나 쓰는 백화점 상품권", ic:"🧾", k:"M"},
    b:{t:"특별한 여행·체험 티켓", ic:"✈️", k:"E"} },
  { e:"✨", q:'"잘했어!"라는 말보다 나에게 더 중요한 건?',
    a:{t:"눈에 보이는 확실한 보상", ic:"💵", k:"M"},
    b:{t:"나에게 남는 의미와 경험", ic:"📖", k:"E"} },

  { e:"⏱️", q:"보상은 언제 받아야 제맛인가요?",
    a:{t:"지금 당장, 바로바로", ic:"⚡", k:"I"},
    b:{t:"모아뒀다가 크게 한 방", ic:"🎯", k:"A"} },
  { e:"🎯", q:"포인트 적립 스타일을 고른다면?",
    a:{t:"쌓이는 족족 바로 쓴다", ic:"🛒", k:"I"},
    b:{t:"참고 모아서 큰 걸 노린다", ic:"🏆", k:"A"} },
  { e:"🍗", q:"목표를 이룬 나에게 주는 상은?",
    a:{t:"그날 저녁 바로 치킨 한 마리", ic:"🍗", k:"I"},
    b:{t:"1년 뒤 큰 목표 달성 후 명품 하나", ic:"👜", k:"A"} },

  { e:"🚀", q:"프로젝트가 대박! 가장 기쁜 순간은?",
    a:{t:"내 기여를 콕 집어 인정받을 때", ic:"🙋", k:"S"},
    b:{t:"우리 팀이 다 같이 축하받을 때", ic:"🙌", k:"T"} },
  { e:"🏅", q:"보상을 받는다면 어느 쪽?",
    a:{t:"나 개인에게 오는 상", ic:"🏅", k:"S"},
    b:{t:"팀 회식·팀 단위 포상", ic:"🎉", k:"T"} },
  { e:"💸", q:"성과급, 이상적인 배분 방식은?",
    a:{t:"기여한 만큼 개인별로 차등", ic:"📊", k:"S"},
    b:{t:"팀이 함께 골고루 나눠서", ic:"🤝", k:"T"} },

  { e:"👏", q:"칭찬받을 때 나는?",
    a:{t:"전체 회의에서 대놓고 박수받기", ic:"👏", k:"P"},
    b:{t:"조용히 따로 한마디가 더 좋아", ic:"🤫", k:"Q"} },
  { e:"📰", q:"사내 게시판에 내 성과가 올라간다면?",
    a:{t:"좋아! 다들 보라고 해", ic:"📢", k:"P"},
    b:{t:"음… 좀 부담스러운데", ic:"😳", k:"Q"} },
  { e:"🎤", q:"상 받는 자리에서 나는?",
    a:{t:"무대 올라가는 거 신난다", ic:"🎤", k:"P"},
    b:{t:"자리에서 받는 게 편하다", ic:"💺", k:"Q"} },
];

const AXES = [
  { left:{k:"M", label:"실속형 · 돈/물질"}, right:{k:"E", label:"가치형 · 경험/의미"} },
  { left:{k:"I", label:"즉시형 · 바로바로"}, right:{k:"A", label:"축적형 · 모아서 크게"} },
  { left:{k:"S", label:"개인형 · 나부터"},   right:{k:"T", label:"팀형 · 함께"} },
  { left:{k:"P", label:"스포트라이트형 · 공개"}, right:{k:"Q", label:"은근형 · 조용히"} },
];

// ===== 16유형 =====
const TYPES = {
  MISP:{e:"🕺",n:"무대 위 인센티브 헌터",tag:"바로 꽂히는 보너스에 스포트라이트까지!",
    desc:"확실한 보상을 지금 당장, 그리고 모두가 보는 앞에서 받을 때 가장 신이 나는 타입. 성과가 나오면 티 나게 인정받고 싶고, 그 에너지가 다음 목표의 연료가 됩니다.",
    loves:["즉시 지급되는 성과 인센티브","전체 회의에서의 이름 호명·시상","이달의 사원 같은 눈에 띄는 타이틀"],
    tip:"성과가 나오면 '바로 + 공개적으로' 보상하세요. 분기 말까지 미루면 동기가 식습니다. 금액이 작아도 '즉시성'과 '무대'가 핵심.",
    good:"EITQ 따뜻한 케어러", bad:"MASQ 묵묵한 자산가"},
  MISQ:{e:"🤑",n:"조용한 보너스 수집가",tag:"티 안 나게, 그러나 확실하게 챙긴다",
    desc:"확실한 보상을 지금 받되, 요란한 무대는 사양하는 타입. 통장에 딱 들어오면 그걸로 충분하고, 관심의 스포트라이트보다 실속을 택합니다.",
    loves:["조용히 지급되는 즉시 인센티브","개인적으로 전하는 감사 + 기프티콘","드러나지 않는 실질 혜택(주유·식비 등)"],
    tip:"공개 시상대에 세우기보다, 1:1로 조용히 '이건 네 몫'이라며 실질 보상을 건네세요. 과한 주목은 오히려 부담.",
    good:"EITP 분위기 메이커", bad:"EASP 커리어 등반가"},
  MITP:{e:"🍻",n:"회식비 스폰서",tag:"우리 팀 쏜다! 다 같이 지금 즐기자",
    desc:"보상은 팀과 함께, 지금 바로, 그리고 왁자지껄하게 즐길 때 최고. 나 혼자보다 다 같이 나눌 때 두 배로 신나는 분위기 메이커형 실속가.",
    loves:["팀 회식비·팀 인센티브 즉시 지급","다 함께하는 깜짝 포상 파티","팀 이름으로 받는 공개 보상"],
    tip:"개인 표창보다 '팀 단위 즉시 보상'이 이 사람을 움직입니다. 성과 직후 팀 회식·팀 포인트를 크게, 공개적으로.",
    good:"MASQ 묵묵한 자산가", bad:"EASQ 자기계발 장인"},
  MITQ:{e:"🎈",n:"몰래 쏘는 팀 서포터",tag:"생색 없이 팀에 실속을 채워주는 사람",
    desc:"팀을 위한 실질적 보상을 지금 챙기되, 자기 공을 드러내진 않는 타입. 조용히 팀 곳간을 채우고 뒤에서 흐뭇해하는 든든한 스타일.",
    loves:["팀에 돌아가는 즉각적 실속 혜택","조용히 마련되는 팀 간식·회식","드러나지 않아도 팀에 남는 실질 보상"],
    tip:"'네 덕분에 팀이 받았다'는 걸 개인적으로만 짚어주세요. 공개 칭찬보다 팀 전체가 누리는 혜택 그 자체가 보상.",

// ===== 상태 =====
let idx = 0;
let answers = [];
let playerName = "";
let currentCode = null;
let savedOnce = false;

const $ = id => document.getElementById(id);
function show(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(screen).classList.add('active');
  window.scrollTo(0,0);
}
function clearErr(){ $('nameErr').textContent=''; }

function start(){
  const name = $('nameInput').value.trim();
  if(name.length < 1){ $('nameErr').textContent='이름(또는 닉네임)을 입력해 주세요 🙂'; $('nameInput').focus(); return; }
  playerName = name;
  idx=0; answers=[]; currentCode=null; savedOnce=false;
  show('quiz'); render();
}

function render(){
  const Q = QUESTIONS[idx];
  $('qnow').textContent = idx+1;
  $('barfill').style.width = (idx/QUESTIONS.length*100) + '%';
  $('qEmoji').textContent = Q.e;
  $('qText').textContent = Q.q;
  const wrap = $('opts');
  wrap.innerHTML = '';
  [Q.a, Q.b].forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="ic">${opt.ic}</span><span>${opt.t}</span>`;
    b.onclick = ()=>choose(opt.k);
    wrap.appendChild(b);
  });
  $('backBtn').style.visibility = idx>0 ? 'visible' : 'hidden';
}

function choose(k){
  answers[idx] = k;
  if(idx < QUESTIONS.length-1){ idx++; render(); }
  else { $('barfill').style.width='100%'; show('done'); }
}

function goBack(){
  if($('done').classList.contains('active')){ show('quiz'); render(); return; }
  if(idx>0){ idx--; render(); }
}

function computeCode(){
  const score = {M:0,E:0,I:0,A:0,S:0,T:0,P:0,Q:0};
  answers.forEach(k=> score[k]++);
  return (score.M>=score.E?'M':'E')+(score.I>=score.A?'I':'A')+
         (score.S>=score.T?'S':'T')+(score.P>=score.Q?'P':'Q');
}

function reveal(){
  currentCode = computeCode();
  showResult(currentCode);
  saveResult();
}

function showResult(code){
  const t = TYPES[code];
  $('rEmoji').textContent = t.e;
  $('rHello').textContent = `${playerName} 님의 보상 유형은…`;
  $('rCode').textContent = code;
  $('rName').textContent = t.n;
  $('rTag').textContent = '"'+t.tag+'"';
  $('rDesc').textContent = t.desc;
  $('rTip').textContent = t.tip;

  const loves = $('rLoves'); loves.innerHTML='';
  t.loves.forEach(l=>{ const li=document.createElement('li'); li.textContent='• '+l; loves.appendChild(li); });

  const axesBox = $('rAxes'); axesBox.innerHTML='';
  AXES.forEach(ax=>{
    const onLeft = code.includes(ax.left.k);
    const div = document.createElement('div');
    div.className='axis';
    div.innerHTML =
      `<span class="pole ${onLeft?'on':''}">${ax.left.label}</span>`+
      `<span class="mid">↔</span>`+
      `<span class="pole ${!onLeft?'on':''}">${ax.right.label}</span>`;
    axesBox.appendChild(div);
  });

  $('rGood').textContent = t.good;
  $('rBad').textContent = t.bad;
  show('result');
}

// ===== 기록 저장 (Neon via /api/results) =====
function setSaveState(cls, msg){
  const el = $('saveState');
  el.className = 'save-state ' + cls;
  el.textContent = msg;
}

async function saveResult(){
  if(savedOnce) return;
  const t = TYPES[currentCode];
  setSaveState('pending', '기록 저장 중…');
  try{
    const res = await fetch('/api/results', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: playerName,
        code: currentCode,
        typeName: t.n,
        answers: answers.join('')
      })
    });
    if(!res.ok) throw new Error('bad status '+res.status);
    savedOnce = true;
    setSaveState('ok', '✅ 결과가 기록되었어요');
  }catch(e){
    setSaveState('err', '⚠️ 기록 저장에 실패했어요 (결과 확인엔 문제 없어요)');
  }
}

// ===== 공유 =====
function buildShareText(){
  const t = TYPES[currentCode];
  return `[보상 MBTI] ${playerName} 님은 "${t.n}" (${currentCode}) ${t.e}\n`+
         `"${t.tag}"\n`+
         `💗 이런 보상에 심장이 뜀: ${t.loves[0]} 등\n`+
         `너의 보상 유형도 알려줘! 👉 ${location.origin}${location.pathname}`;
}

async function shareResult(){
  const text = buildShareText();
  const shareData = { title:'보상 MBTI', text };
  try { shareData.url = location.origin + location.pathname; } catch(e){}
  if(navigator.share){
    try{ await navigator.share(shareData); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  copyText(text);
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>toast('결과 문구가 복사됐어요! 팀 채팅방에 붙여넣기 👍'),
      ()=>fallbackCopy(text)
    );
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('결과 문구가 복사됐어요! 👍'); }
  catch(e){ toast('복사가 안 되면 화면을 캡처해 주세요 📸'); }
  document.body.removeChild(ta);
}
function toast(msg){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#23204a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:88%;text-align:center';
  document.body.appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .4s'; d.style.opacity='0'; setTimeout(()=>d.remove(),400); }, 2200);
}

function restart(){
  $('nameInput').value = playerName;
  show('intro');
}
</script>
