<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대물보상 MBTI · 전체 기록</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#132019;--muted:#5c6f66;--line:#e7efe9;--card:#fff;
    --brand:#0f9d63;--brand-deep:#0b7a4d;--brand-soft:#e6f6ee;
    --shadow:0 22px 60px -18px rgba(14,80,55,.35);--shadow-sm:0 8px 22px -12px rgba(14,80,55,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:var(--ink);background:#eaf4ee;
    background-image:radial-gradient(60% 45% at 12% 0%,rgba(15,157,99,.16),transparent 60%),radial-gradient(55% 40% at 100% 10%,rgba(56,199,255,.12),transparent 60%);
    min-height:100vh;padding:24px 16px 60px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px 22px;margin-bottom:16px;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
  h1{font-size:23px;font-weight:900;letter-spacing:-.8px;}
  .sub{color:var(--muted);font-size:13.5px;margin-top:2px;font-weight:500;}
  a.home{color:var(--brand-deep);font-weight:800;font-size:13.5px;text-decoration:none;background:var(--brand-soft);padding:9px 14px;border-radius:12px;white-space:nowrap;}
  .stat-row{display:flex;gap:11px;flex-wrap:wrap;}
  .stat{flex:1;min-width:110px;background:var(--brand-soft);border-radius:15px;padding:14px 16px;}
  .stat .big{font-size:25px;font-weight:900;color:var(--brand-deep);letter-spacing:-.5px;}
  .stat .lbl{font-size:12.5px;color:var(--muted);font-weight:700;}
  .refresh{border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--brand-deep);background:var(--brand-soft);padding:9px 14px;border-radius:12px;}
  .sect-title{font-size:14px;font-weight:900;color:var(--brand-deep);margin-bottom:14px;}
  .dist ul{list-style:none;}
  .dist li{margin-bottom:11px;}
  .bar-line{display:flex;align-items:center;gap:10px;}
  .bar-line .nm{width:160px;font-size:13px;font-weight:700;flex-shrink:0;word-break:keep-all;}
  .bar-line .track{flex:1;height:16px;background:#eef3f0;border-radius:999px;overflow:hidden;}
  .bar-line .fill{height:100%;background:linear-gradient(90deg,var(--brand),#38c7a0);border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.3,1);}
  .bar-line .cnt{width:34px;text-align:right;font-size:13px;font-weight:800;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);}
  th{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.3px;}
  td.code{font-weight:900;color:var(--brand-deep);letter-spacing:1.5px;}
  td.when{color:var(--muted);font-size:12.5px;white-space:nowrap;}
  .empty{text-align:center;color:var(--muted);padding:28px 0;font-weight:700;}
  .tablewrap{overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div><h1>📊 대물보상 MBTI 기록</h1><p class="sub">참가자 결과와 유형 분포</p></div>
      <a class="home" href="./index.html">← 테스트로</a>
    </div>
    <div class="stat-row" id="stats"></div>
    <div style="text-align:right;margin-top:14px;"><button class="refresh" onclick="load()">↻ 새로고침</button></div>
  </div>

  <div class="card dist">
    <p class="sect-title">🏆 유형 분포</p>
    <ul id="dist"></ul>
    <div id="distEmpty" class="empty" style="display:none;">아직 기록이 없어요.</div>
  </div>

  <div class="card">
    <p class="sect-title">🧾 참가자 기록</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>이름</th><th>유형</th><th>코드</th><th>시각</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="rowsEmpty" class="empty" style="display:none;">아직 참가한 사람이 없어요. 첫 주자가 되어보세요! 🎉</div>
  </div>
</div>

<script>
const TYPE_META={
  ISTJ:["📋","약관 스나이퍼"],ISFJ:["🫶","센터의 살림꾼"],ESTJ:["🎖️","대물 지휘관"],ESFJ:["🤝","민원 제로 메이커"],
  ISTP:["🔧","현장의 정비 탐정"],ISFP:["🍃","평화주의 사정사"],ESTP:["🚗","현장 돌격대장"],ESFP:["🎉","정비소 인싸"],
  INTJ:["♟️","대물 전략가"],INTP:["🔬","견적 해부학자"],ENTP:["🕵️","허점 스캐너"],ENTJ:["👑","보상 CEO"],
  INFJ:["🕊️","고객의 통역사"],INFP:["🌱","이상주의 사정사"],ENFP:["🔥","열정 해결사"],ENFJ:["🧭","센터의 구심점"],
};
const $=id=>document.getElementById(id);
function fmt(ts){try{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}catch(e){return ts;}}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function load(){
  try{
    const res=await fetch('/api/results?limit=1000',{cache:'no-store'});
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'error');
    render(data);
  }catch(e){
    $('stats').innerHTML=`<div class="stat"><div class="lbl" style="color:#d6446a">기록을 불러오지 못했어요</div><div class="lbl">Neon(DATABASE_URL) 연결과 배포 상태를 확인해 주세요.</div></div>`;
  }
}
function render(data){
  const results=data.results||[], counts=data.counts||[], total=data.total||results.length;
  const top=counts[0], topLabel=top?`${(TYPE_META[top.code]||['','?'])[0]} ${(TYPE_META[top.code]||['','?'])[1]}`:'—';
  $('stats').innerHTML=
    `<div class="stat"><div class="big">${total}</div><div class="lbl">총 참가자</div></div>`+
    `<div class="stat"><div class="big">${counts.length}<span style="font-size:15px">/16</span></div><div class="lbl">나온 유형 수</div></div>`+
    `<div class="stat"><div class="big" style="font-size:17px;line-height:1.4">${topLabel}</div><div class="lbl">가장 많은 유형</div></div>`;

  const distEl=$('dist'); distEl.innerHTML='';
  const max=counts.reduce((m,c)=>Math.max(m,c.count),0)||1;
  if(!counts.length){ $('distEmpty').style.display='block'; }
  else{ $('distEmpty').style.display='none';
    counts.forEach(c=>{const[emoji,name]=TYPE_META[c.code]||['❓',c.code];const li=document.createElement('li');
      li.innerHTML=`<div class="bar-line"><span class="nm">${emoji} ${name}</span><span class="track"><span class="fill" style="width:${c.count/max*100}%"></span></span><span class="cnt">${c.count}</span></div>`;
      distEl.appendChild(li);});
  }

  const rowsEl=$('rows'); rowsEl.innerHTML='';
  if(!results.length){ $('rowsEmpty').style.display='block'; }
  else{ $('rowsEmpty').style.display='none';
    results.forEach((r,i)=>{const[emoji,name]=TYPE_META[r.code]||['❓',r.type_name||''];const tr=document.createElement('tr');
      tr.innerHTML=`<td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${emoji} ${escapeHtml(r.type_name||name)}</td><td class="code">${escapeHtml(r.code)}</td><td class="when">${fmt(r.created_at)}</td>`;
      rowsEl.appendChild(tr);});
  }
}
load();
</script>
</body>
</html>
