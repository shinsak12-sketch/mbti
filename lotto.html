<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>로또 · 점심 복불복</title>
<meta name="theme-color" content="#0d3628" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="icons/lotto-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/lotto-192.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

  :root{
    --felt:#124635; --felt-2:#0d3628; --felt-3:#082a1f;
    --gold:#e9c96a; --gold-2:#c9a13d; --gold-3:#8d6b1a;
    --cream:#f6ecd4; --cream-2:#e8dbbd; --ink:#1a1a1a;
    --red:#c8322b; --red-2:#8e1f1a;
    --txt:#f2efe4; --muted:#a9c2b6;
    --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.55);
    --r:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:var(--txt);
    background:var(--felt-2);
    background-image:
      radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.10), transparent 55%),
      radial-gradient(90% 60% at 50% 110%, rgba(0,0,0,.55), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, var(--felt) 0%, var(--felt-2) 60%, var(--felt-3) 100%);
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
    line-height:1.5; -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:980px;margin:0 auto;}
  .screen{display:none;}
  .screen.active{display:block;animation:rise .45s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

  /* ---------- 양각 / 음각 공통 ---------- */
  .panel{
    background:linear-gradient(150deg,#175540 0%,#0f3d2e 55%,#0b3225 100%);
    border-radius:var(--r);
    box-shadow:14px 14px 32px rgba(0,0,0,.5), -8px -8px 22px rgba(255,255,255,.055), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.35);
    position:relative;
  }
  .inset{
    background:linear-gradient(160deg,#0a2e22,#0d3829);
    border-radius:18px;
    box-shadow:inset 7px 7px 16px rgba(0,0,0,.58), inset -4px -4px 10px rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.08);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;cursor:pointer;font-family:inherit;font-weight:800;
    border-radius:16px;padding:14px 18px;font-size:16px;color:#2a1d05;
    background:linear-gradient(180deg,#f3d98a 0%,var(--gold) 45%,var(--gold-2) 100%);
    box-shadow:0 8px 0 var(--gold-3), 0 16px 26px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(0,0,0,.12);
    transform:translateY(0);transition:transform .08s ease, box-shadow .08s ease, filter .2s;
    letter-spacing:-.2px;
  }
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--gold-3), 0 6px 12px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5);}
  .btn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed;}
  .btn.ghost{
    color:var(--txt);
    background:linear-gradient(180deg,#1b5a45,#124635);
    box-shadow:0 6px 0 #061d15, 0 14px 22px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .btn.ghost:active{transform:translateY(5px);box-shadow:0 1px 0 #061d15, inset 0 1px 0 rgba(255,255,255,.1);}
  .btn.danger{color:#fff;background:linear-gradient(180deg,#e0554b,#b3271f);box-shadow:0 6px 0 #5f130f, 0 14px 22px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.35);}
  .btn.danger:active{transform:translateY(5px);box-shadow:0 1px 0 #5f130f;}
  .btn.sm{padding:10px 14px;font-size:14px;border-radius:13px;}
  .btn.block{width:100%;font-size:19px;padding:18px 20px;border-radius:20px;}

  /* ---------- 설정 화면 ---------- */
  .setup{max-width:520px;margin:0 auto;padding:30px 24px 26px;}
  .logo{text-align:center;margin-bottom:22px;}
  .logo .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--gold);
    padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 3px 3px 7px rgba(0,0,0,.6), inset -2px -2px 5px rgba(255,255,255,.06);}
  .logo h1{
    margin-top:14px;font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;
    background:linear-gradient(180deg,#fff2c4 0%,var(--gold) 50%,var(--gold-2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.45)) drop-shadow(0 12px 22px rgba(0,0,0,.4));
  }
  .logo p{margin-top:10px;color:var(--muted);font-size:14px;font-weight:600;}
  .field-label{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center;}
  .field-label small{font-weight:600;letter-spacing:0;opacity:.8;}

  .stepper{display:flex;align-items:center;gap:14px;padding:14px;}
  .stepper .num{flex:1;text-align:center;font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);}
  .stepper .num small{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:800;margin-top:6px;}
  .round{
    width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;font-size:30px;font-weight:900;color:#2a1d05;font-family:inherit;
    background:linear-gradient(180deg,#f3d98a,var(--gold) 50%,var(--gold-2));
    box-shadow:0 6px 0 var(--gold-3), 0 12px 18px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .08s, box-shadow .08s; flex:none;
  }
  .round:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gold-3), inset 0 1px 0 rgba(255,255,255,.5);}
  .round:disabled{filter:grayscale(.7) brightness(.6);}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;}
  .mode{border:none;cursor:pointer;font-family:inherit;text-align:left;color:var(--txt);padding:14px 14px 12px;border-radius:16px;
    background:linear-gradient(180deg,#1b5a45,#124635);
    box-shadow:0 6px 0 #061d15, 0 12px 20px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .1s, box-shadow .1s, background .2s; position:relative;overflow:hidden;}
  .mode .ic{font-size:26px;display:block;line-height:1;margin-bottom:8px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));}
  .mode b{display:block;font-size:15px;letter-spacing:-.3px;}
  .mode small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600;}
  .mode:active{transform:translateY(5px);box-shadow:0 1px 0 #061d15;}
  .mode.on{color:#2a1d05;background:linear-gradient(180deg,#f3d98a 0%,var(--gold) 45%,var(--gold-2) 100%);
    box-shadow:0 6px 0 var(--gold-3), 0 12px 20px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.7);}
  .mode.on small{color:#5a4410;}
  .mode.on::after{content:'✓';position:absolute;right:12px;top:10px;width:22px;height:22px;border-radius:50%;background:#2a1d05;color:var(--gold);font-size:13px;font-weight:900;display:grid;place-items:center;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-top:14px;}
  .toggle-row b{font-size:15px;display:block;}
  .toggle-row small{color:var(--muted);font-size:12px;font-weight:600;display:block;margin-top:2px;}
  .switch{position:relative;width:60px;height:34px;border-radius:999px;background:rgba(0,0,0,.45);flex:none;cursor:pointer;
    box-shadow:inset 4px 4px 9px rgba(0,0,0,.7), inset -2px -2px 5px rgba(255,255,255,.06);transition:background .25s;}
  .switch::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;
    background:linear-gradient(180deg,#f4f0e4,#cfc6ad);box-shadow:0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 #fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1);}
  .switch.on{background:linear-gradient(180deg,#d2b053,#a67d1f);}
  .switch.on::after{transform:translateX(26px);}

  .start-wrap{margin-top:24px;}
  .hint{margin-top:14px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.6;word-break:keep-all;}

  /* ---------- 게임 화면 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap;}
  .topbar .title{font-weight:900;font-size:18px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;}
  .topbar .title .pill.mode-pill{color:#ffb4ad;}
  .topbar .title .pill{font-size:12px;font-weight:800;color:var(--gold);padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.3);box-shadow:inset 3px 3px 6px rgba(0,0,0,.6), inset -2px -2px 4px rgba(255,255,255,.06);}
  .topbar .actions{display:flex;gap:8px;flex-wrap:wrap;}


  .seat{padding:14px 12px 12px;border-radius:20px;transition:box-shadow .3s, transform .3s, opacity .4s, background .4s;position:relative;}
  .seat .who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .seat .who .nm{font-weight:900;font-size:15px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
  .seat .who .nm i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:900;color:#2a1d05;
    background:linear-gradient(180deg,#f3d98a,var(--gold-2));box-shadow:0 2px 0 var(--gold-3);}
  .seat .rankno{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;
    background:linear-gradient(180deg,#e6efe9,#b7c7bf);color:#1b2a24;box-shadow:0 3px 0 #5c6f66, 0 8px 14px -6px rgba(0,0,0,.7);animation:pop .5s cubic-bezier(.3,1.6,.5,1);}
  .seat .rankno.gold{background:linear-gradient(180deg,#f3d98a,var(--gold-2));color:#2a1d05;box-shadow:0 3px 0 var(--gold-3), 0 8px 14px -6px rgba(0,0,0,.7);}
  .seat.out{opacity:.38;filter:saturate(.5);}
  .seat.out .cards{pointer-events:none;}
  .seat.dim{opacity:.55;}
  .seat.hit{
    opacity:1;filter:none;z-index:3;
    animation:hitshake .7s cubic-bezier(.36,.07,.19,.97) both, hitglow 1.6s ease-in-out infinite .7s;
    box-shadow:inset 7px 7px 16px rgba(0,0,0,.58), inset -4px -4px 10px rgba(255,255,255,.06), 0 0 0 3px var(--gold), 0 0 40px 6px rgba(233,201,106,.45);
    background:linear-gradient(160deg,#4a2a12,#7a1e17);
  }
  .seat.hit.high{background:linear-gradient(160deg,#4a3a10,#8a6a12);}
  @keyframes hitshake{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0) scale(1.03)}30%,50%,70%{transform:translate3d(-6px,0,0) scale(1.04)}40%,60%{transform:translate3d(6px,0,0) scale(1.04)}100%{transform:scale(1.03)}}
  @keyframes hitglow{0%,100%{box-shadow:inset 7px 7px 16px rgba(0,0,0,.58), 0 0 0 3px var(--gold), 0 0 28px 4px rgba(233,201,106,.35);transform:scale(1.03)}50%{box-shadow:inset 7px 7px 16px rgba(0,0,0,.58), 0 0 0 4px #fff2c4, 0 0 60px 12px rgba(233,201,106,.7);transform:scale(1.05)}}
  .seat.tie{box-shadow:inset 7px 7px 16px rgba(0,0,0,.58), 0 0 0 3px #ff9d95, 0 0 30px 4px rgba(255,120,110,.4);animation:tiepulse 1.2s ease-in-out infinite;}
  @keyframes tiepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  .seat .stamp{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-12deg) scale(0);
    padding:10px 16px;border-radius:14px;font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap;color:#fff;z-index:4;
    background:linear-gradient(180deg,#e0554b,#b3271f);box-shadow:0 6px 0 #5f130f, 0 18px 30px -8px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.4);
    border:3px solid #fff2c4;animation:stamp .6s cubic-bezier(.2,1.6,.4,1) .55s forwards;
  }
  .seat .stamp.high{background:linear-gradient(180deg,#f3d98a,var(--gold-2));color:#2a1d05;box-shadow:0 6px 0 var(--gold-3), 0 18px 30px -8px rgba(0,0,0,.8);border-color:#fff;}
  .seat .stamp.tiestamp{background:linear-gradient(180deg,#5c6a64,#2e3835);box-shadow:0 6px 0 #141a18;font-size:17px;}
  .seat .stamp small{display:block;font-size:11px;letter-spacing:.1em;opacity:.9;text-align:center;margin-bottom:2px;}
  .verdict{margin-top:16px;text-align:center;min-height:0;}
  .verdict .box{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;color:var(--txt);
    background:rgba(0,0,0,.3);box-shadow:inset 4px 4px 9px rgba(0,0,0,.6), inset -2px -2px 5px rgba(255,255,255,.06);animation:pop .5s cubic-bezier(.3,1.6,.5,1);flex-wrap:wrap;justify-content:center;}
  .verdict .box b{color:var(--gold);}
  .burst{position:fixed;left:0;top:0;font-size:24px;pointer-events:none;z-index:40;will-change:transform,opacity;}
  .seat .who .st{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;flex:none;}
  .seat.done .who .st{color:var(--gold);}
  .seat.done .wait{display:none;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

  /* ---------- 화투 카드 ---------- */
  @keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}


  /* ---------- 쪼기 스테이지 (앞장 밀어내리기) ---------- */
  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;color:#2a1d05;
    background:linear-gradient(180deg,#f3d98a,var(--gold-2));box-shadow:0 4px 0 var(--gold-3), 0 14px 24px -8px rgba(0,0,0,.7);opacity:0;transition:.3s;z-index:60;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}


  .home-link{position:absolute;left:14px;top:14px;text-decoration:none;color:var(--muted);font-weight:800;font-size:13px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 3px 3px 7px rgba(0,0,0,.6), inset -2px -2px 5px rgba(255,255,255,.06);z-index:2;}
  .game-wrap{max-width:520px;margin:0 auto;}
  .turn{text-align:center;font-weight:900;font-size:16px;letter-spacing:-.3px;margin:2px 0 10px;min-height:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);word-break:keep-all;}
  .turn b{color:var(--gold);}
  .foot{margin-top:18px;text-align:center;color:rgba(255,255,255,.35);font-size:11.5px;font-weight:600;word-break:keep-all;}
  .modes.two .mode{padding:14px 12px 12px;}

  /* ---------- 추첨기 ---------- */
  .stage{position:relative;padding:8px 6px 4px;}
  .machine{position:relative;margin:0 auto;}
  .globe{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(10,46,34,.35), rgba(4,24,17,.75) 70%, rgba(0,0,0,.85) 100%);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.14), inset 0 -24px 50px rgba(0,0,0,.55), inset 0 18px 30px rgba(255,255,255,.06), 0 26px 40px -16px rgba(0,0,0,.85);}
  .globe canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;}
  .globe .gloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(60% 34% at 36% 18%, rgba(255,255,255,.38), rgba(255,255,255,0) 70%), radial-gradient(30% 16% at 72% 82%, rgba(255,255,255,.10), rgba(255,255,255,0) 70%);}
  .globe .ring{position:absolute;left:-6px;right:-6px;top:50%;height:12px;transform:translateY(-50%);border-radius:999px;pointer-events:none;
    background:linear-gradient(180deg,#f3d98a,var(--gold-2) 55%,var(--gold-3));box-shadow:0 4px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6);opacity:.55;}
  .globe.blow{animation:gshake .12s linear infinite;}
  @keyframes gshake{0%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}50%{transform:translate(-.6px,.6px)}75%{transform:translate(.6px,.4px)}100%{transform:translate(0,0)}}
  .neck{position:absolute;width:34px;height:22px;border-radius:8px 8px 4px 4px;transform:translateX(-50%);
    background:linear-gradient(180deg,#f3d98a,var(--gold-2) 60%,var(--gold-3));box-shadow:0 3px 0 #5d470f, inset 0 1px 0 rgba(255,255,255,.6);}
  .stand{position:absolute;transform:translateX(-50%);}
  .stand::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:44px;height:28px;background:linear-gradient(90deg,#5d470f,#c9a13d 40%,#f3d98a 55%,#8d6b1a);border-radius:4px;}
  .stand::after{content:'';position:absolute;left:50%;top:26px;transform:translateX(-50%);width:150px;height:22px;border-radius:12px 12px 6px 6px;
    background:linear-gradient(180deg,#1b5a45,#0e3a2b);box-shadow:0 8px 0 #061d15, 0 16px 24px -10px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.18);}
  svg.chute{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  .air{position:absolute;pointer-events:none;font-weight:900;font-size:11px;letter-spacing:.14em;color:var(--muted);transform:translateX(-50%);opacity:.0;transition:opacity .3s;}
  .air.on{opacity:.9;}

  /* 로또 공 */
  .lball{--c1:#ffd23f;--c2:#e0a800;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 6%, var(--c1) 30%, var(--c2) 100%);
    box-shadow:0 4px 8px rgba(0,0,0,.45), inset -3px -4px 8px rgba(0,0,0,.25);}
  .lball .num{width:62%;height:62%;border-radius:50%;background:#fff;color:#1a1a1a;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:-.5px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);}
  .lball.hide .num{opacity:0;}
  .lball.reveal{animation:reveal .62s cubic-bezier(.3,1.4,.5,1);}
  .lball.reveal .num{animation:numIn .62s steps(1,end);}
  @keyframes reveal{0%{transform:scaleX(1)}30%{transform:scaleX(.08) scaleY(1.06)}55%{transform:scaleX(1.15) scaleY(.95)}100%{transform:none}}
  @keyframes numIn{0%{opacity:0}30%{opacity:1}100%{opacity:1}}
  .lball.fly{position:absolute;left:0;top:0;z-index:20;pointer-events:none;}
  .lball.glow{box-shadow:0 0 0 3px #fff2c4, 0 0 22px 6px rgba(255,236,150,.75), 0 4px 8px rgba(0,0,0,.45);}

  /* 추첨대 */
  .tray{display:grid;gap:6px;padding:10px;margin-top:6px;align-items:center;}
  .slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
    background:rgba(0,0,0,.28);box-shadow:inset 3px 3px 7px rgba(0,0,0,.7), inset -2px -2px 5px rgba(255,255,255,.06);}
  .slot .lball{width:100%;height:100%;}
  .slot .lball .num{font-size:clamp(10px,3.3vw,14px);}
  .slot.plus{background:none;box-shadow:none;color:var(--muted);font-weight:900;font-size:18px;}
  .slot small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;color:var(--muted);white-space:nowrap;letter-spacing:.04em;}
  .slot.bonus small{color:var(--gold);}
  .ctrl{display:flex;gap:10px;margin-top:18px;}
  .ctrl .btn.block{flex:1;}
  .ctrl .btn.auto{flex:none;width:96px;font-size:15px;border-radius:20px;}

  /* 자리 카드 */
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}

  .tn{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(10px,2.9vw,13px);color:var(--muted);
    background:rgba(0,0,0,.28);box-shadow:inset 2px 2px 5px rgba(0,0,0,.6), inset -1px -1px 3px rgba(255,255,255,.05);transition:.25s;}
  .tn.hit{color:#1a1a1a;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 6%, var(--c1) 34%, var(--c2) 100%);box-shadow:0 0 0 2px #fff2c4, 0 0 14px 2px rgba(255,236,150,.6);animation:tnpop .5s cubic-bezier(.3,1.7,.5,1);}
  .tn.bon{box-shadow:0 0 0 2px var(--gold), inset 2px 2px 5px rgba(0,0,0,.6);color:var(--gold);}
  @keyframes tnpop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  .seat .edit{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:8px;text-align:center;letter-spacing:.04em;}

  .seat.tiecand{box-shadow:inset 7px 7px 16px rgba(0,0,0,.58), 0 0 0 3px #ff9d95, 0 0 26px 4px rgba(255,120,110,.35);animation:tiepulse 1.2s ease-in-out infinite;}

  .seat .stamp{z-index:5;}

  .seat .who .nm{white-space:nowrap;} .seat .cnt{white-space:nowrap;flex:none;}
  /* 번호 고르기 시트 */

  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h4{font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}

  .pickgrid button{aspect-ratio:1;border:none;border-radius:50%;font-family:inherit;font-weight:900;font-size:13px;color:var(--muted);cursor:pointer;
    background:rgba(0,0,0,.28);box-shadow:inset 2px 2px 5px rgba(0,0,0,.6), inset -1px -1px 3px rgba(255,255,255,.05);transition:transform .08s;}

  .pickgrid button.on{color:#1a1a1a;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 6%, var(--c1) 34%, var(--c2) 100%);box-shadow:0 3px 6px rgba(0,0,0,.45);}
  .sheet .row{display:flex;gap:8px;margin-top:14px;}

</style>

<body>
<div class="wrap">
  <!-- ========== 설정 ========== -->
  <section id="scr-setup" class="screen active">
    <div class="panel setup">
      <a class="home-link" href="lunch.html">‹ 홈</a>
      <div class="logo">
        <span class="tag">LUNCH BOKBULBOK</span>
        <h1>로또</h1>
        <p>추첨기 돌려서 한 개씩 · 마지막 공까지 쫄깃하게</p>

        <button class="mode" data-kind="escape"><span class="ic">🫧</span><b>공 탈출</b><small>1인 1공 · 하나씩 뽑혀 탈출</small></button>

        <button class="mode" data-mode="high"><span class="ic">👑</span><b id="highLab">많이 맞춘 사람</b><small id="highSub">운 좋은 놈이 쏨</small></button>

  <!-- ========== 게임 ========== -->
  <section id="scr-game" class="screen">

        <div class="title">🎱 로또 <span class="pill" id="roundPill">1판</span><span class="pill mode-pill" id="modePill">적게 맞춘 사람 쏨</span></div>
        <div class="actions">

<div class="sheet-bg" id="sheetBg"><div class="panel sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let actx=null;
const S={
  ctx(){ if(!state.sound) return null; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }catch(e){return null;} },
  noise(dur=.08,vol=.25,f=1800,q=.8){ const c=this.ctx(); if(!c) return; const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const src=c.createBufferSource(); src.buffer=buf; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q; const g=c.createGain(); g.gain.value=vol; src.connect(bp).connect(g).connect(c.destination); src.start(); },
  tone(freq=660,dur=.12,vol=.18,type='triangle',slide=0){ const c=this.ctx(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=freq; if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),c.currentTime+dur); g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.02); },
  tick(){ this.noise(.03,.08,3000); },
  creak(d){ this.noise(.05,.05+d*.08,300+d*900,3); },
  twang(){ this.tone(180,.25,.25,'sawtooth',-120); this.noise(.06,.3,1200); },
  whoosh(){ this.noise(.35,.25,900,.6); },
  thud(){ this.noise(.08,.45,300,1.2); this.tone(90,.18,.3,'sine',-50); },
  pop(){ this.tone(660,.12,.15); setTimeout(()=>this.tone(880,.16,.15),90); },
  gong(){ this.tone(220,1.2,.25,'sine'); this.tone(330,1.0,.12,'triangle'); setTimeout(()=>this.tone(440,.9,.12,'sine'),120); },
  fail(){ this.tone(300,.25,.15,'sawtooth',-160); },
  heart(){ this.tone(70,.09,.25,'sine'); setTimeout(()=>this.tone(60,.1,.2,'sine'),140); },
};

/* 추가 효과음 */
S.blow=null;
S.blowStart=function(level){ const c=this.ctx(); if(!c) return; if(!this.blow){ const len=c.sampleRate*1.5; const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; const src=c.createBufferSource(); src.buffer=buf; src.loop=true; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=.6; const g=c.createGain(); g.gain.value=0; src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(); this.blow={src,g,bp}; } const t=c.currentTime; this.blow.g.gain.cancelScheduledValues(t); this.blow.g.gain.linearRampToValueAtTime(.05+.13*level,t+.25); this.blow.bp.frequency.linearRampToValueAtTime(500+700*level,t+.25); };
S.blowStop=function(){ if(!this.blow||!actx) return; const t=actx.currentTime; this.blow.g.gain.cancelScheduledValues(t); this.blow.g.gain.linearRampToValueAtTime(0,t+.4); };
S.clack=function(v){ this.tone(1400+Math.random()*900,.03,Math.min(.07,.015+v*.00008),'square'); };
S.roll=function(){ this.noise(.5,.08,2400,2); };
S.land=function(){ this.tone(520,.06,.12,'triangle'); this.noise(.04,.12,2000); };
S.match=function(k){ this.tone(660+k*90,.1,.14); setTimeout(()=>this.tone(990+k*90,.14,.12),80); };

/* ---------- 랜덤 (crypto) ---------- */
const rnd=()=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; };
const rint=n=>Math.floor(rnd()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rint(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const autoTicket=()=>shuffle([...Array(45)].map((_,i)=>i+1)).slice(0,6).sort((a,b)=>a-b);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 공 색: 실제 로또 색 · 자리공은 10색 */
function lottoColor(n){ if(n<=10) return ['#ffd23f','#d9a200']; if(n<=20) return ['#6cc8f5','#2585c4']; if(n<=30) return ['#ff7b7b','#cf3434']; if(n<=40) return ['#c4c4c4','#7a7a7a']; return ['#b5e05a','#64a01a']; }
const SEATC=[['#ffd23f','#d9a200'],['#6cc8f5','#2585c4'],['#ff7b7b','#cf3434'],['#b5e05a','#64a01a'],['#c99bff','#7b45d6'],['#ffb15c','#d9741a'],['#5fe0c8','#159a85'],['#ff8fcf','#cf3a8f'],['#c4c4c4','#7a7a7a'],['#8fa9ff','#3d5bd6']];
function ballHTML(n,col,hide,extra=''){ return `<div class="lball ${hide?'hide':''} ${extra}" style="--c1:${col[0]};--c2:${col[1]}"><span class="num">${n}</span></div>`; }

/* ---------- 상태 ---------- */
const state={ count:4, kind:'lotto', mode:'low', sound:true, round:0,
  phase:'ready', // ready → drawing → tie → done
  tickets:[], manual:[], drawn:[], escaped:[], tie:null, busy:false, auto:false };
const el={ setup:$('#scr-setup'), game:$('#scr-game'), countNum:$('#countNum'), turn:$('#turn'), seats:$('#seats'), tray:$('#tray'), drawBtn:$('#drawBtn'), autoBtn:$('#autoBtn'), verdict:$('#verdict'), reroll:$('#reroll'),
  roundPill:$('#roundPill'), modePill:$('#modePill'), machine:$('#machine'), globe:$('#globe'), cv:$('#cv'), neck:$('#neck'), stand:$('#stand'), chute:$('#chute'), stage:$('#stage'), air:$('#air'), toast:$('#toast') };
const vib=p=>{ if(!state.sound) return; try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
function toast(m,ms=1600){ el.toast.textContent=m; el.toast.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.toast.classList.remove('show'),ms); }
function show(s){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); s.classList.add('active'); window.scrollTo({top:0}); }

/* ---------- 설정 ---------- */
function renderSetup(){
  el.countNum.textContent=state.count; $('#minus').disabled=state.count<=2; $('#plus').disabled=state.count>=10;
  document.querySelectorAll('#kindModes .mode').forEach(b=>b.classList.toggle('on',b.dataset.kind===state.kind));
  document.querySelectorAll('#modeModes .mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));
  if(state.kind==='lotto'){ $('#lowLab').textContent='적게 맞춘 사람'; $('#lowSub').textContent='꽝 · 제일 적게 맞추면 쏨'; $('#highLab').textContent='많이 맞춘 사람'; $('#highSub').textContent='운 좋은 놈이 쏨';
    $('#setupHint').innerHTML='번호는 <b>자동</b>으로 깔림 · 자리 카드 누르면 <b>직접 고르기</b><br>동점이면 그 자리만 모아서 <b>재대결 추첨</b>'; }
  else { $('#lowLab').textContent='마지막 남은 공'; $('#lowSub').textContent='끝까지 못 나온 사람 쏨'; $('#highLab').textContent='첫 번째 나온 공'; $('#highSub').textContent='한 방 · 제일 먼저 뽑히면 쏨';
    $('#setupHint').innerHTML='자리마다 <b>공 하나</b> · 추첨기에서 하나씩 뽑히면 <b>탈출</b><br>마지막 두 개 남으면 심장 쫄깃 모드'; }
}
$('#minus').onclick=()=>{ if(state.count>2){ state.count--; renderSetup(); S.tick(); } };
$('#plus').onclick=()=>{ if(state.count<10){ state.count++; renderSetup(); S.tick(); } };
document.querySelectorAll('#kindModes .mode').forEach(b=>b.onclick=()=>{ state.kind=b.dataset.kind; renderSetup(); S.tick(); });
document.querySelectorAll('#modeModes .mode').forEach(b=>b.onclick=()=>{ state.mode=b.dataset.mode; renderSetup(); S.tick(); });
$('#sound').onclick=function(){ state.sound=!state.sound; this.classList.toggle('on',state.sound); this.setAttribute('aria-checked',state.sound); if(state.sound) S.tick(); else S.blowStop(); };
$('#start').onclick=()=>{ S.ctx(); state.round=0; state.manual=[]; state.tickets=[]; show(el.game); layout(); newRound(); };
$('#toSetup').onclick=()=>{ if(state.busy) return; M.blowTo(0); S.blowStop(); show(el.setup); };

/* ---------- 추첨기 물리 ---------- */
const M={ balls:[], blow:0, target:0, D:300, C:150, RI:142, last:0, clackT:0,
  init(){ this.ctx=el.cv.getContext('2d'); requestAnimationFrame(t=>this.loop(t)); },
  size(D){ this.D=D; this.C=D/2; this.RI=D/2-7; const dpr=Math.min(2,window.devicePixelRatio||1); el.cv.width=D*dpr; el.cv.height=D*dpr; this.ctx.setTransform(dpr,0,0,dpr,0,0); },
  fill(list){ // list: [{n,col}]
    const k=list.length; const r=k>20? this.RI*0.092 : this.RI*0.15; this.balls=[];
    list.forEach((b,i)=>{ const a=rnd()*Math.PI*2, d=rnd()*this.RI*0.55; this.balls.push({n:b.n,col:b.col,r,x:this.C+Math.cos(a)*d,y:this.C+this.RI*0.35+Math.sin(a)*d*0.4,vx:(rnd()-.5)*60,vy:0,exit:null,gone:false}); });
  },
  blowTo(v){ this.target=v; el.globe.classList.toggle('blow',v>0.6); el.air.classList.toggle('on',v>0); if(v>0) S.blowStart(v); else S.blowStop(); },
  step(dt){
    const C=this.C, RI=this.RI, g=980; this.blow+=(this.target-this.blow)*Math.min(1,dt*5);
    const bl=this.blow;
    for(const b of this.balls){ if(b.gone||b.exit) continue;
      b.vy+=g*dt;
      if(bl>0.01){ const depth=(b.y-C)/RI; if(depth>-0.1){ b.vy-=(2300+rnd()*3200)*bl*dt*(0.35+depth); } b.vx+=(rnd()-.5)*3000*bl*dt; b.vy+=(rnd()-.5)*1600*bl*dt; }
      b.vx*=0.996; b.vy*=0.998;
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      const dx=b.x-C, dy=b.y-C, d=Math.hypot(dx,dy)||1, lim=RI-b.r;
      if(d>lim){ const nx=dx/d, ny=dy/d; b.x=C+nx*lim; b.y=C+ny*lim; const vn=b.vx*nx+b.vy*ny; if(vn>0){ b.vx-=1.72*vn*nx; b.vy-=1.72*vn*ny; b.vx*=0.98; if(vn>260) this.clack(vn); } }
    }
    const bs=this.balls;
    for(let i=0;i<bs.length;i++){ const a=bs[i]; if(a.gone||a.exit) continue;
      for(let j=i+1;j<bs.length;j++){ const b=bs[j]; if(b.gone||b.exit) continue;
        const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r; const d2=dx*dx+dy*dy; if(d2>=rr*rr||d2===0) continue;
        const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=(rr-d)/2; a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv<0){ const jj=-(1.88)*rv/2; a.vx-=jj*nx; a.vy-=jj*ny; b.vx+=jj*nx; b.vy+=jj*ny; if(-rv>320) this.clack(-rv); } } }
  },
  clack(v){ const t=performance.now(); if(t-this.clackT<45) return; this.clackT=t; S.clack(v); },
  loop(t){ const dt=Math.min(1/30,(t-(this.last||t))/1000); this.last=t;
    if(el.game.classList.contains('active')){ this.step(dt/2); this.step(dt/2); this.exitStep(t); this.draw(); }
    requestAnimationFrame(tt=>this.loop(tt)); },
  exitStep(t){ for(const b of this.balls){ if(!b.exit||b.gone) continue; const e=b.exit; const k=clamp((t-e.t0)/e.dur,0,1); const s=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; b.x=e.x0+(this.C-e.x0)*s; b.y=e.y0+((this.C-this.RI+b.r*0.6)-e.y0)*s; if(k>=1){ b.gone=true; e.done&&e.done(); } } },
  draw(){ const c=this.ctx, D=this.D; c.clearRect(0,0,D,D);
    const order=this.balls.filter(b=>!b.gone).sort((a,b)=>(a.exit?1:0)-(b.exit?1:0));
    for(const b of order){ const gr=c.createRadialGradient(b.x-b.r*.38,b.y-b.r*.45,b.r*.08,b.x,b.y,b.r); gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(.3,b.col[0]); gr.addColorStop(1,b.col[1]);
      c.beginPath(); c.arc(b.x,b.y,b.r,0,Math.PI*2); c.fillStyle=gr; c.fill();
      if(b.exit){ c.lineWidth=3; c.strokeStyle='rgba(255,242,196,.95)'; c.stroke(); }
      if(b.r>=9){ c.beginPath(); c.arc(b.x,b.y,b.r*.56,0,Math.PI*2); c.fillStyle='rgba(255,255,255,.95)'; c.fill(); c.fillStyle='#1a1a1a'; c.font=`900 ${Math.round(b.r*.72)}px Pretendard, system-ui, sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(b.n,b.x,b.y+b.r*.04); }
    } },
  pick(n,onOut){ const b=this.balls.find(x=>x.n===n&&!x.gone&&!x.exit); if(!b) return onOut(); b.exit={t0:performance.now(),dur:520,x0:b.x,y0:b.y,done:onOut}; }
};

/* ---------- 레이아웃 ---------- */
let geo=null;
function layout(){
  const W=el.stage.clientWidth-12; const D=Math.round(clamp(W*0.66,200,300)); const top=40; const gx=Math.round(Math.min(W*0.42, W-D/2-60)); const gy=top+D/2;
  el.machine.style.width=W+'px'; el.machine.style.height=(top+D+52)+'px';
  Object.assign(el.globe.style,{width:D+'px',height:D+'px',left:(gx-D/2)+'px',top:top+'px'});
  Object.assign(el.neck.style,{left:gx+'px',top:(top-16)+'px'});
  Object.assign(el.stand.style,{left:gx+'px',top:(top+D-4)+'px'});
  Object.assign(el.air.style,{left:gx+'px',top:(top+D+6)+'px'});
  M.size(D);
  const cx=Math.min(W-22, gx+D/2+42); const y0=top-14, y1=top-34, yb=top+D+40;
  const path=`M ${gx} ${y0} C ${gx} ${y1-8}, ${gx+30} ${y1}, ${gx+56} ${y1} L ${cx-26} ${y1} Q ${cx} ${y1} ${cx} ${y1+26} L ${cx} ${yb}`;
  el.chute.setAttribute('width',W); el.chute.setAttribute('height',yb+10);
  el.chute.innerHTML=`<path d="${path}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/><path id="chutePath" d="${path}" fill="none" stroke="none"/>`;
  geo={W,D,gx,gy,top,cx,yb};
}
window.addEventListener('resize',()=>{ if(!el.game.classList.contains('active')||state.busy) return; layout(); refillMachine(); });

/* ---------- 판 준비 ---------- */
function newRound(){
  state.round++; state.loser=null; state.phase='ready'; state.drawn=[]; state.escaped=[]; state.tie=null; state.busy=false; state.auto=false;
  el.roundPill.textContent=state.round+'판';
  el.modePill.textContent= state.kind==='lotto' ? (state.mode==='low'?'적게 맞춘 사람 쏨':'많이 맞춘 사람 쏨') : (state.mode==='low'?'마지막 공 쏨':'첫 공 쏨');
  el.verdict.innerHTML='';
  if(state.kind==='lotto'){ const old=state.tickets; state.tickets=[...Array(state.count)].map((_,i)=>state.manual[i]&&old[i]?old[i]:autoTicket()); }
  el.reroll.hidden=state.kind!=='lotto';
  M.blowTo(0); refillMachine(); renderTray(); renderSeats(); updateCtrl();
  setTurn(state.kind==='lotto' ? '번호 확인 · 카드 누르면 <b>직접 고르기</b> · 뽑기 누르면 추첨 시작' : '자리마다 공 하나 · 뽑기 누르면 <b>탈출 추첨</b>');
}
function refillMachine(){
  if(state.phase==='tie'&&state.tie){ M.fill(state.tie.filter(i=>!state.tieDrawn).map(i=>({n:i+1,col:SEATC[i%10]}))); return; }
  if(state.kind==='lotto'){ const out=new Set(state.drawn); M.fill([...Array(45)].map((_,i)=>i+1).filter(n=>!out.has(n)).map(n=>({n,col:lottoColor(n)}))); }
  else { const out=new Set(state.escaped); if(state.phase==='done'&&state.loser!=null) out.add(state.loser); M.fill([...Array(state.count)].map((_,i)=>i).filter(i=>!out.has(i)).map(i=>({n:i+1,col:SEATC[i%10]}))); }
}
function setTurn(h){ el.turn.innerHTML=h; }
function updateCtrl(){
  const done=state.phase==='done';
  el.drawBtn.disabled=state.busy; el.autoBtn.disabled=state.busy||done||state.phase==='tie';
  el.drawBtn.textContent= done ? '🎲 새 판' : (state.phase==='tie' ? '🔥 재대결 뽑기' : '🎱 한 개 뽑기');
  el.reroll.disabled=state.busy||state.phase!=='ready';
}
el.reroll.onclick=()=>{ if(state.phase!=='ready'||state.busy) return; state.manual=[]; state.tickets=state.tickets.map(()=>autoTicket()); renderSeats(); S.tick(); vib(10); toast('전부 자동으로 다시 뽑음'); };

/* ---------- 추첨대 ---------- */
function renderTray(){
  const t=el.tray; t.innerHTML='';
  if(state.phase==='tie'){ t.style.gridTemplateColumns='repeat(1,48px)'; t.style.justifyContent='center'; t.innerHTML=`<div class="slot" data-i="0"><small>재대결</small></div>`; return; }
  t.style.justifyContent='';
  if(state.kind==='lotto'){ t.style.gridTemplateColumns='repeat(6,1fr) 14px 1fr';
    let h=''; for(let i=0;i<6;i++){ const n=state.drawn[i]; h+=`<div class="slot" data-i="${i}">${n?ballHTML(n,lottoColor(n)):''}<small>${i+1}</small></div>`; }
    const b=state.drawn[6]; h+=`<div class="slot plus">+</div><div class="slot bonus" data-i="6">${b?ballHTML(b,lottoColor(b)):''}<small>보너스</small></div>`; t.innerHTML=h; }
  else { const k=state.count; t.style.gridTemplateColumns=`repeat(${k},1fr)`; let h=''; for(let i=0;i<k;i++){ const s=state.escaped[i]; h+=`<div class="slot" data-i="${i}">${s!=null?ballHTML(s+1,SEATC[s%10]):''}<small>${i+1}</small></div>`; } t.innerHTML=h; }
}

/* ---------- 자리 카드 ---------- */
function score(i){ const t=state.tickets[i]; const main=state.drawn.slice(0,6); const m=t.filter(n=>main.includes(n)).length; const bon=state.drawn.length>6&&t.includes(state.drawn[6]); return {m,bon,v:m+(bon?0.5:0)}; }
function renderSeats(){
  const g=el.seats; g.innerHTML='';
  for(let i=0;i<state.count;i++){
    const d=document.createElement('div'); d.className='inset seat'; d.dataset.i=i;
    if(state.kind==='lotto'){
      const t=state.tickets[i], sc=score(i), main=state.drawn.slice(0,6), bonus=state.drawn[6];
      d.innerHTML=`<div class="who"><span class="nm"><i>${i+1}</i>${i+1}번 자리</span><span class="cnt ${sc.m?'hot':''}">${sc.m}개${sc.bon?' +B':''}</span></div>
        <div class="ticket">${t.map(n=>{ const col=lottoColor(n); const hit=main.includes(n); const bon=n===bonus; return `<span class="tn ${hit?'hit':''} ${bon&&!hit?'bon':''}" style="--c1:${col[0]};--c2:${col[1]}">${n}</span>`; }).join('')}</div>
        ${state.phase==='ready'?`<div class="edit">${state.manual[i]?'<b>직접 고른 번호</b> · 눌러서 수정':'자동 · 눌러서 직접 고르기'}</div>`:''}`;
      d.onclick=()=>{ if(state.phase==='ready'&&!state.busy) openPicker(i); };
    } else {
      const k=state.escaped.indexOf(i);
      d.innerHTML=`<div class="who"><span class="nm"><i>${i+1}</i>${i+1}번 자리</span></div><div class="myball">${ballHTML(i+1,SEATC[i%10])}<span class="st ${k>=0?'safe':''}">${k>=0?(state.mode==='high'&&k===0?'첫 공':`${k+1}번째 탈출`):(state.phase==='done'?'끝까지 남음':'추첨기 안')}</span></div>`;
      if(k>=0) d.classList.add('escaped');
    }
    if(state.phase==='tie'&&state.tie&&state.tie.includes(i)) d.classList.add('tiecand');
    g.appendChild(d);
  }
}

/* ---------- 번호 고르기 ---------- */
let pick=null;
function openPicker(i){ pick={i,sel:state.tickets[i].slice()}; renderPicker(); $('#sheetBg').classList.add('show'); S.tick(); }
function renderPicker(){
  const sh=$('#sheet'); const sel=new Set(pick.sel);
  sh.innerHTML=`<h4>${pick.i+1}번 자리 번호<small>${pick.sel.length} / 6</small></h4><div class="inset pickgrid">${[...Array(45)].map((_,k)=>{ const n=k+1, col=lottoColor(n); return `<button data-n="${n}" class="${sel.has(n)?'on':''}" style="--c1:${col[0]};--c2:${col[1]}">${n}</button>`; }).join('')}</div>
    <div class="row"><button class="btn ghost sm" id="pkAuto">자동</button><button class="btn ghost sm" id="pkClear">지우기</button><button class="btn sm" id="pkOk" ${pick.sel.length===6?'':'disabled'}>확인</button></div>`;
  sh.querySelectorAll('.pickgrid button').forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; const k=pick.sel.indexOf(n); if(k>=0) pick.sel.splice(k,1); else if(pick.sel.length<6) pick.sel.push(n); else { toast('6개까지'); return; } pick.sel.sort((a,b)=>a-b); S.tick(); vib(5); renderPicker(); });
  $('#pkAuto').onclick=()=>{ pick.sel=autoTicket(); S.tick(); renderPicker(); };
  $('#pkClear').onclick=()=>{ pick.sel=[]; renderPicker(); };
  $('#pkOk').onclick=()=>{ state.tickets[pick.i]=pick.sel.slice(); state.manual[pick.i]=true; closePicker(); renderSeats(); };
}
function closePicker(){ $('#sheetBg').classList.remove('show'); pick=null; }
$('#sheetBg').onclick=e=>{ if(e.target===$('#sheetBg')) closePicker(); };

/* ---------- 추첨 ---------- */
el.drawBtn.onclick=()=>{ if(state.busy) return; if(state.phase==='done'){ newRound(); return; } state.auto=false; drawOne(); };
el.autoBtn.onclick=async()=>{ if(state.busy||state.phase==='done'||state.phase==='tie') return; state.auto=true; while(state.auto&&(state.phase==='ready'||state.phase==='drawing')){ await drawOne(); if(state.phase==='drawing') await sleep(350); } };

function remainingCount(){ return state.kind==='lotto' ? 7-state.drawn.length : state.count-state.escaped.length; }
function isFinalBall(){ if(state.phase==='tie') return true; if(state.kind==='lotto') return state.drawn.length>=5; return state.mode==='high' ? true : remainingCount()===2; }

async function drawOne(){
  if(state.busy) return; state.busy=true; updateCtrl();
  if(state.phase==='ready') state.phase='drawing';
  const final=isFinalBall();
  // 1) 섞기
  const mix = state.drawn.length===0&&state.escaped.length===0&&state.phase!=='tie' ? 2100 : (final?2700:1400);
  setTurn(final ? (state.phase==='tie'?'🔥 재대결 · <b>먼저 뽑히는 사람이 쏨</b>':(state.kind==='lotto'&&state.drawn.length===6?'보너스 볼 · <b>마지막 한 개</b>':'<b>쫄깃</b> · 이번 공이 판을 가름')) : '섞는 중…');
  M.blowTo(1); vib(15);
  let beat=null; if(final){ beat=setInterval(()=>{ S.heart(); vib(12); },560); }
  await sleep(mix);
  // 2) 순수 랜덤으로 공 결정
  let n, seat=null;
  if(state.phase==='tie'){ const cand=state.tie; seat=cand[rint(cand.length)]; n=seat+1; }
  else if(state.kind==='lotto'){ const out=new Set(state.drawn); const pool=[...Array(45)].map((_,i)=>i+1).filter(x=>!out.has(x)); n=pool[rint(pool.length)]; }
  else { const out=new Set(state.escaped); const pool=[...Array(state.count)].map((_,i)=>i).filter(x=>!out.has(x)); seat=pool[rint(pool.length)]; n=seat+1; }
  M.blowTo(.45);
  // 3) 흡입 → 관 → 받침대
  await new Promise(res=>M.pick(n,res));
  if(beat) clearInterval(beat);
  const col = state.kind==='lotto'&&state.phase!=='tie' ? lottoColor(n) : SEATC[(n-1)%10];
  const slotIdx = state.phase==='tie' ? 0 : (state.kind==='lotto' ? state.drawn.length : state.escaped.length);
  await flyBall(n,col,slotIdx,final);
  // 4) 반영
  if(state.phase==='tie'){ state.tieDrawn=true; renderTray(); placeInSlot(0,n,col,false); finish(seat); return; }
  if(state.kind==='lotto'){
    state.drawn.push(n); const isBonus=state.drawn.length===7;
    const hits=[]; state.tickets.forEach((t,i)=>{ if(t.includes(n)) hits.push(i); });
    renderSeats();
    hits.forEach((i,k)=>{ const c=el.seats.children[i]; if(c){ c.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'}); } setTimeout(()=>S.match(k),k*90); });
    if(hits.length) vib([10,30,10]);
    setTurn(hits.length ? `<b>${n}</b> · ${hits.map(i=>i+1+'번').join(', ')} ${isBonus?'보너스':'맞춤'}` : `<b>${n}</b> · 아무도 없음`);
    state.busy=false; updateCtrl();
    if(isBonus){ state.auto=false; await sleep(700); judgeLotto(); }
  } else {
    state.escaped.push(seat); renderSeats(); S.match(0);
    if(state.mode==='high'){ state.busy=false; finish(seat); return; }
    if(remainingCount()===1){ const last=[...Array(state.count)].map((_,i)=>i).find(i=>!state.escaped.includes(i)); state.busy=false; await sleep(500); finish(last); return; }
    setTurn(`<b>${seat+1}번</b> 탈출 · 남은 공 ${remainingCount()}개`);
    state.busy=false; updateCtrl();
  }
  M.blowTo(state.phase==='drawing'?.3:0);
}

function flyBall(n,col,slotIdx,final){
  return new Promise(res=>{
    const slot=el.tray.querySelector(`.slot[data-i="${slotIdx}"]`); const path=document.getElementById('chutePath');
    if(!slot||!path){ placeInSlot(slotIdx,n,col,true); res(); return; }
    const sr=slot.getBoundingClientRect(), stR=el.stage.getBoundingClientRect(), mR=el.machine.getBoundingClientRect();
    const size=Math.min(40,sr.width); const offX=mR.left-stR.left, offY=mR.top-stR.top;
    const f=document.createElement('div'); f.innerHTML=ballHTML(n,col,true,'fly'); const ball=f.firstChild; ball.style.width=ball.style.height=size+'px'; el.stage.appendChild(ball);
    const L=path.getTotalLength(), kf=[]; const N=22;
    for(let i=0;i<=N;i++){ const p=path.getPointAtLength(L*i/N); kf.push({transform:`translate(${offX+p.x-size/2}px,${offY+p.y-size/2}px) rotate(${i*40}deg)`, offset:i/N*0.82}); }
    const tx=sr.left-stR.left+(sr.width-size)/2, ty=sr.top-stR.top+(sr.height-size)/2;
    kf.push({transform:`translate(${tx}px,${ty-10}px) rotate(${N*40+30}deg)`, offset:.93}); kf.push({transform:`translate(${tx}px,${ty}px) rotate(${N*40+40}deg)`, offset:1});
    S.roll();
    const an=ball.animate(kf,{duration:final?1350:1050,easing:'cubic-bezier(.45,.05,.55,.95)',fill:'forwards'});
    an.onfinish=async()=>{ ball.remove(); placeInSlot(slotIdx,n,col,true); S.land(); vib(10);
      await sleep(final?650:260); // 숫자 공개 전 멈칫
      const lb=slot.querySelector('.lball'); if(lb){ lb.classList.remove('hide'); lb.classList.add('reveal'); if(final) lb.classList.add('glow'); }
      S.pop(); await sleep(620); res(); };
  });
}
function placeInSlot(i,n,col,hide){ const slot=el.tray.querySelector(`.slot[data-i="${i}"]`); if(!slot) return; const small=slot.querySelector('small'); slot.innerHTML=ballHTML(n,col,hide); if(small) slot.appendChild(small); }

/* ---------- 판정 ---------- */
function judgeLotto(){
  const sc=state.tickets.map((_,i)=>score(i).v); const tgt= state.mode==='low' ? Math.min(...sc) : Math.max(...sc);
  const losers=sc.map((v,i)=>v===tgt?i:-1).filter(i=>i>=0);
  if(losers.length===1){ finish(losers[0]); return; }
  // 동점 → 그 자리만 재대결 추첨 (먼저 뽑히는 사람이 쏨)
  state.phase='tie'; state.tie=losers; state.tieDrawn=false; state.busy=false;
  S.fail(); vib([30,40,30]);
  setTimeout(()=>{ renderTray(); refillMachine(); renderSeats(); M.blowTo(.25); updateCtrl();
    const lab=tgt===Math.floor(tgt)?`${tgt}개`:`${Math.floor(tgt)}개 + 보너스`;
    setTurn(`동점 <b>${losers.map(i=>i+1+'번').join(' · ')}</b> (${lab}) · 재대결 · <b>먼저 뽑히는 사람이 쏨</b>`);
    toast('동점 · 재대결 추첨'); },600);
}
function finish(seat){
  state.loser=seat; state.phase='done'; state.busy=false; state.auto=false; M.blowTo(0);
  if(state.kind==='escape'&&state.mode==='low'&&!state.escaped.includes(seat)){ M.balls.forEach(b=>{ if(b.n===seat+1) b.gone=true; }); placeInSlot(state.count-1,seat+1,SEATC[seat%10],false); const lb=el.tray.querySelector(`.slot[data-i="${state.count-1}"] .lball`); if(lb) lb.classList.add('glow','reveal'); const sm=el.tray.querySelector(`.slot[data-i="${state.count-1}"] small`); if(sm){ sm.textContent='꽝'; sm.style.color='#ff9d95'; } }
  renderSeats();
  const isHigh=state.mode==='high';
  [...el.seats.children].forEach((c,i)=>{ c.classList.remove('tiecand'); if(i===seat){ c.classList.add('hit'); if(isHigh) c.classList.add('high'); const st=document.createElement('div'); st.className='stamp'+(isHigh?' high':''); st.innerHTML=`<small>${isHigh?'LUCKY':'LUNCH'}</small>점심 당첨`; c.appendChild(st); } else c.classList.add('dim'); });
  let why='';
  if(state.kind==='lotto'){ const s=score(seat); why=`${s.m}개${s.bon?' + 보너스':''} 맞춤`; if(state.tie) why+=' · 재대결 패'; }
  else why= isHigh?'첫 번째로 뽑힘':'마지막까지 남음';
  el.verdict.innerHTML=`<div class="box">${isHigh?'👑':'🍱'} <b>${seat+1}번 자리</b> 오늘 점심 쏨 · ${why}</div>`;
  setTurn(`<b>${seat+1}번 자리</b> 점심 당첨 · 새 판 누르면 다시`);
  S.gong(); vib([40,60,40,60,120]);
  const c=el.seats.children[seat]; if(c){ c.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>burstAt(c,isHigh?['👑','💰','✨','🎉']:['🍱','🍜','🍚','🍙','🥟','🍕']),350); }
  updateCtrl();
}
function burstAt(anchor,emo){
  const r=anchor.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<24;i++){ const s=document.createElement('span'); s.className='burst'; s.textContent=emo[Math.floor(Math.random()*emo.length)]; s.style.left=cx+'px'; s.style.top=cy+'px'; s.style.fontSize=(16+Math.random()*18)+'px'; document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=110+Math.random()*200, dur=900+Math.random()*700, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-110, rot=(Math.random()-.5)*720;
    s.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(0deg)',opacity:1},{transform:`translate(calc(-50% + ${dx*.6}px),calc(-50% + ${dy*.6}px)) scale(1.2) rotate(${rot*.5}deg)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+220}px)) scale(.9) rotate(${rot}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'}).onfinish=()=>s.remove(); }
}

renderSetup(); M.init();
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ S.blowStop(); } else if(M.target>0){ S.blowStart(M.target); } });
</script>
