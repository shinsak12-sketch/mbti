<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>골프 내기 · 디자인 시안 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter','Noto Sans KR',-apple-system,system-ui,sans-serif;background:#e9ebef;color:#111;padding:28px 18px 60px;-webkit-font-smoothing:antialiased}
  h1{font-size:26px;font-weight:900;letter-spacing:-.6px}
  .sub{color:#667;font-size:14px;margin-top:6px}
  .dir{margin-top:34px}
  .dir h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
  .dir h2 span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#111;color:#fff}
  .dir p{color:#667;font-size:13px;margin-top:4px}
  .row{display:flex;gap:22px;overflow-x:auto;padding:22px 4px 10px}
  .phone{flex:none;width:300px;height:640px;border-radius:38px;padding:10px;background:#0b0b0d;box-shadow:0 30px 60px -20px rgba(0,0,0,.45),0 0 0 2px #2a2a2e inset;position:relative}
  .phone::before{content:'';position:absolute;left:50%;top:18px;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#000;z-index:5}
  .scr{width:100%;height:100%;border-radius:30px;overflow:hidden;position:relative;font-size:13px;background:var(--bg);color:var(--ink)}
  .cap{font-size:12px;font-weight:700;color:#556;text-align:center;margin-top:10px}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .A{--bg:#f3f4f6;--card:#fff;--ink:#0f1115;--mut:#7a808c;--line:#e5e7eb;--acc:#16a34a;--accs:rgba(22,163,74,.12);--red:#e5484d;--blue:#2f6fed;--chip:#eceef2;--hero:#0f1115;--heroink:#fff}
  .B{--bg:#0e1014;--card:#171a20;--ink:#f3f4f6;--mut:#8b919e;--line:#252932;--acc:#c6ff3d;--accs:rgba(198,255,61,.14);--red:#ff5d5d;--blue:#6aa3ff;--chip:#20242c;--hero:#c6ff3d;--heroink:#0e1014}

  .pad{padding:50px 16px 16px;height:100%;overflow:hidden}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .top h3{font-size:22px;font-weight:900;letter-spacing:-.6px}
  .top .sm{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
  .ic{width:34px;height:34px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
  .mut{color:var(--mut)}
  .lbl{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.08em;margin:14px 2px 8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:14px;font-weight:800;font-size:14px;background:var(--ink);color:var(--bg)}
  .B .btn{background:var(--acc);color:#0e1014}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{height:40px;font-size:13px;border-radius:12px}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--chip);color:var(--ink);border:2px solid var(--card)}
  .up{color:var(--acc)} .dn{color:var(--red)}

  /* ---------- ① 리스트 : 통계 스트립 + 히어로 + 타일 그리드 ---------- */
  .stats{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 0;margin-bottom:12px}
  .stats div{flex:1;text-align:center;border-right:1px solid var(--line)}
  .stats div:last-child{border:none}
  .stats b{display:block;font-size:16px;font-weight:900;letter-spacing:-.5px}
  .stats small{font-size:10px;color:var(--mut);font-weight:700}
  .hero{background:var(--hero);color:var(--heroink);border-radius:22px;padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
  .hero .tag{font-size:10px;font-weight:800;letter-spacing:.1em;opacity:.75}
  .hero h4{font-size:19px;font-weight:900;letter-spacing:-.4px;margin-top:4px}
  .hero .meta{font-size:11px;opacity:.75;margin-top:2px}
  .hero .holes{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-top:14px}
  .hero .holes i{height:16px;border-radius:4px;background:rgba(255,255,255,.18)}
  .B .hero .holes i{background:rgba(0,0,0,.18)}
  .hero .holes i.f{background:var(--heroink);opacity:.9}
  .hero .holes i.cur{outline:2px solid var(--heroink);outline-offset:1px;background:transparent}
  .hero .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .hero .lead{font-size:12px;font-weight:800}
  .hero .lead b{font-size:15px}
  .hero .go{width:40px;height:40px;border-radius:14px;background:var(--heroink);color:var(--hero);display:grid;place-items:center}
  .hero .ring{position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
  .B .hero .ring{border-color:rgba(0,0,0,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;position:relative;min-height:112px}
  .tile .d{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.06em}
  .tile b{display:block;font-size:14px;letter-spacing:-.3px;margin-top:3px;line-height:1.25}
  .tile .kind{display:inline-block;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--chip);color:var(--mut);margin-top:6px}
  .tile .avs{display:flex;position:absolute;left:12px;bottom:12px}
  .tile .avs .av{width:22px;height:22px;font-size:9px;margin-left:-6px}
  .tile .avs .av:first-child{margin-left:0}
  .tile .w{position:absolute;right:12px;bottom:12px;font-size:12px;font-weight:900}
  .tile.new{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mut);font-weight:800;font-size:12px;background:transparent}
  .tile.new svg{width:26px;height:26px;margin-bottom:6px}

  /* ---------- ② 설정 : 아바타 열 + 종류 가로 스와이프 + 금액 다이얼 + 칩 옵션 ---------- */
  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps i{flex:1;height:4px;border-radius:4px;background:var(--chip)} .steps i.on{background:var(--acc)}
  .pavs{display:flex;gap:10px;align-items:flex-start}
  .pav{display:flex;flex-direction:column;align-items:center;gap:6px;width:56px}
  .pav .av{width:50px;height:50px;font-size:16px;border:2px solid var(--line);background:var(--card)}
  .pav .av.add{border-style:dashed;color:var(--mut);background:transparent}
  .pav span{font-size:11px;font-weight:700}
  .pav span.n{color:var(--mut);font-size:10px}
  .kinds{display:flex;gap:10px;overflow:hidden;margin-left:-16px;padding-left:16px;margin-right:-16px}
  .kind{flex:none;width:150px;border-radius:18px;padding:14px;background:var(--card);border:1.5px solid var(--line)}
  .kind.on{border-color:var(--acc);background:var(--accs)}
  .kind b{display:block;font-size:15px;letter-spacing:-.3px;margin-top:8px}
  .kind small{display:block;color:var(--mut);font-size:10.5px;font-weight:600;line-height:1.4;margin-top:4px}
  .kind .ck{width:18px;height:18px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center;float:right}
  .B .kind .ck{color:#0e1014}
  .dial{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
  .dial .v{font-size:30px;font-weight:900;letter-spacing:-1.2px}
  .dial .v small{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:0}
  .dial .b{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:20px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:800;padding:8px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--mut);background:var(--card)}
  .chip.on{border-color:var(--acc);background:var(--accs);color:var(--ink)}
  .B .chip.on{color:var(--acc)}

  /* ---------- ③ 홀 입력 : 홀 스트립 + 2x2 타일 + 티커 ---------- */
  .hstrip{display:flex;gap:6px;overflow:hidden;margin:0 -16px;padding:0 16px 2px}
  .hstrip div{flex:none;width:34px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--mut)}
  .hstrip div small{font-size:9px;font-weight:700;opacity:.8}
  .hstrip div.f{color:var(--ink)}
  .hstrip div.f::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:2px}
  .hstrip div.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.08)}
  .B .hstrip div.cur{background:var(--acc);color:#0e1014;border-color:var(--acc)}
  .hhead{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
  .hhead .n{font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1}
  .hhead .n small{font-size:12px;letter-spacing:0;color:var(--mut);font-weight:700;margin-left:6px}
  .hhead .par{display:flex;gap:4px}
  .hhead .par span{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--card);border:1px solid var(--line);font-size:11px}
  .hhead .par span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .B .hhead .par span.on{background:var(--acc);color:#0e1014;border-color:var(--acc)}
  .ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;position:relative;overflow:hidden}
  .pt .hd{display:flex;align-items:center;justify-content:space-between}
  .pt .hd b{font-size:14px;letter-spacing:-.3px}
  .pt .hd small{font-size:11px;font-weight:800}
  .pt .sc{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .pt .sc span{width:34px;height:34px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:18px;font-weight:600}
  .pt .sc b{font-size:34px;font-weight:900;letter-spacing:-1.5px;line-height:1}
  .pt .res{font-size:10.5px;font-weight:800;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
  .pt .res em{font-style:normal;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--mut)}
  .pt .res em.b{background:rgba(47,111,237,.14);color:var(--blue)} .pt .res em.o{background:rgba(229,72,77,.14);color:var(--red)} .pt .res em.p{background:var(--accs);color:var(--acc)}
  .pt .fl{display:flex;gap:4px;margin-top:8px}
  .pt .fl i{flex:1;height:24px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--mut);font-style:normal}
  .pt .fl i.on{background:var(--red);border-color:var(--red);color:#fff}
  .pt.dbl::before{content:'배판 ×2';position:absolute;right:-26px;top:10px;transform:rotate(38deg);background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:2px 30px;letter-spacing:.05em}
  .ticker{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
  .ticker .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--accs)}
  .hnav{display:flex;gap:8px;margin-top:10px}
  .hnav .btn{flex:1}

  /* ---------- ④ 정산 : 포디움 + 흐름도 + 히트바 ---------- */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:150px;margin-top:4px}
  .pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .pod .av{width:38px;height:38px;font-size:13px}
  .pod .nm{font-size:12px;font-weight:800}
  .pod .nm small{display:block;text-align:center;font-size:11px;font-weight:900}
  .pod .bar{width:100%;border-radius:12px 12px 4px 4px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--mut)}
  .pod.p1 .bar{height:66px;background:var(--hero);color:var(--heroink);border-color:var(--hero)}
  .pod.p2 .bar{height:46px} .pod.p3 .bar{height:30px}
  .pod.p1 .av{border:3px solid var(--acc)}
  .flow{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:12px}
  .flow .r{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;padding:6px 0}
  .flow .r .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--red),var(--acc));border-radius:2px;position:relative}
  .flow .r .ln::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--acc)}
  .flow .r .amt{font-size:12.5px;font-weight:900;min-width:52px;text-align:right}
  .heat{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-top:10px}
  .heat i{height:14px;border-radius:3px;background:var(--chip)}
  .heat i.w{background:var(--acc)} .heat i.l{background:var(--red);opacity:.75}
  .jar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--chip);border-radius:14px;padding:10px 12px}
  .jar b{font-size:15px;font-weight:900}
  .jar small{display:block;font-size:10px;color:var(--mut);font-weight:700}
  .jar .seg{display:flex;gap:3px;flex:1;margin:0 12px;height:8px;border-radius:4px;overflow:hidden}
  .jar .seg i{display:block;background:var(--red)} .jar .seg i:nth-child(2){background:var(--blue)} .jar .seg i:nth-child(3){background:var(--acc)}

  .choose{margin-top:40px;background:#fff;border-radius:18px;padding:18px 20px}
  .choose h3{font-size:16px;font-weight:900;margin-bottom:8px}
  .choose li{margin-left:18px;font-size:14px;color:#334;line-height:1.7}
</style>
</head>
<body>
<h1>골프 내기 · 디자인 시안 v2</h1>
<div class="sub">이모지 없음 · 선 아이콘만. 화면마다 레이아웃 다름: 히어로+타일 / 아바타+스와이프 / 홀 스트립+2×2 / 포디움+흐름도.</div>

<section class="dir"><h2><span>A</span> 라이트</h2><p>연회색 바닥, 흰 카드, 검정 히어로, 그린 포인트.</p><div class="row" id="rowA"></div></section>
<section class="dir"><h2><span>B</span> 다크</h2><p>차콜 바닥, 라임 히어로·포인트.</p><div class="row" id="rowB"></div></section>

<div class="choose">
  <h3>정해줄 것</h3>
  <ul>
    <li>A / B / 섞기</li>
    <li>포인트 컬러: 그린 / 라임 / 블루 / 오렌지</li>
    <li>홀 입력: 2×2 타일(지금) / 세로 리스트 / 한 명씩 넘기기</li>
  </ul>
</div>

  <div class="stats"><div><b class="up">+58,000</b><small>올해 수익</small></div><div><b>86.4</b><small>평균 타수</small></div><div><b>7</b><small>승</small></div></div>
  <div class="hero"><div class="ring"></div>

</div></div></div>

<!-- ② 설정 -->
<div class="phone"><div class="scr X"><div class="pad">
  <div class="top"><div><h3>새 경기</h3><div class="sm">1 / 3 · 플레이어</div></div><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="lbl">플레이어 · 눌러서 이름</div>
  <div class="pavs">
    <div class="pav"><span class="av">민</span><span>민수</span></div>
    <div class="pav"><span class="av">준</span><span>준호</span></div>
    <div class="pav"><span class="av">현</span><span>현우</span></div>
