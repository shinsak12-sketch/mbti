<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조직개편 캔버스</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2c; --panel2:#1c2436;
    --ink:#e8ecf4; --muted:#93a0b8; --line:#2c374d; --accent:#4f8cff;
    --c1:#5b8def; --c2:#31c48d; --c3:#f0883e; --gold:#d9b25a;
    --tft:#a78bfa; --tft-ink:#c4b5fd;
    --leaf-bg:#131a28; --leaf-ink:#cdd6e6; --team-bd:#37455f;
    --import:#e6b878; --import-bd:#5a4526; --import-bg:rgba(224,150,60,.08);
    --smart:#8fc0ff; --smart-bd:#274a72; --smart-bg:rgba(79,140,255,.09);
    --auto:#e05a4d;
    --new:#2ecc71; --closed:#e74c3c; --moved:#4f8cff; --renamed:#f0b429; --promoted:#9d84e8; --merged:#1abc9c; --combined:#1abc9c; --demoted:#e67e22;
    --ceo1:#2b3654; --ceo2:#1b2438; --ceo-bd:#384a68;
  }
  body.light{
    --bg:#eef1f7; --panel:#ffffff; --panel2:#f4f7fc; --ink:#1f2836; --muted:#5c6a80; --line:#d5dce9;
    --tft:#7c3aed; --tft-ink:#6d28d9;
    --leaf-bg:#f5f8fd; --leaf-ink:#2b3a54; --team-bd:#c5cee0;
    --import:#96640f; --import-bd:#e6cfa0; --import-bg:#fbf3e4;
    --smart:#1c60b8; --smart-bd:#bcd6f4; --smart-bg:#eaf2fd;
    --auto:#c0392b;
    --ceo1:#33507a; --ceo2:#22334f; --ceo-bd:#2b405f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding:0 0 130px;transition:background .2s,color .2s}

  .toolbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 14px}
  .toolbar .row{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .toolbar .row+.row{margin-top:8px}
  .brand{font-size:14px;font-weight:800;margin-right:6px;white-space:nowrap}
  .vtab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer}
  .vtab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(79,140,255,.3)}
  .vc{display:inline-block;background:var(--new);color:#08301c;border-radius:20px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:800}
  .vtab.on .vc{background:rgba(255,255,255,.28);color:#fff}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--new);border-color:var(--new);color:#08301c}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .spacer{flex:1}
  .help{max-width:1440px;margin:8px auto 0;font-size:12.5px;color:var(--muted)}
  .help b{color:var(--gold)}
  .help.mode{color:var(--merged);font-weight:700}
  .help.mode b{color:var(--merged)}

  .wrap{max-width:1440px;margin:20px auto 0;padding:0 16px}
  .hqcol{display:flex;flex-direction:column}
  @media(min-width:760px){ .hqcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start} }
  @media(min-width:1080px){ .hqcols{grid-template-columns:1fr 1fr 1fr} }
  .stats{display:inline-flex;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px;max-width:100%}
  .stats .t{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.3px}
  .stats .row{display:flex;flex-wrap:wrap;gap:6px}
  .stats .cell{font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
  .stats .cell .v{color:var(--accent);margin-left:3px}
  .stats .up{color:var(--new);margin-left:3px;font-size:11px}
  .stats .dn{color:var(--closed);margin-left:3px;font-size:11px}

  .ceo-area{display:flex;justify-content:center}
  .ceo{background:linear-gradient(135deg,var(--ceo1),var(--ceo2));border:1px solid var(--ceo-bd);color:#fff;padding:14px 40px;border-radius:14px;font-size:18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center;flex:none}
  .ceo small{display:block;font-size:10px;font-weight:600;color:#c9d3e6;letter-spacing:2px;margin-top:2px}
  .rail{width:2px;height:22px;background:var(--line);margin:10px auto 0}
  /* 감사파트: CEO 아래 중앙선에서 좌측으로 가지 치는 하위 조직 */
  .staff{position:relative;padding:6px 0 8px}
  .staff::before{content:"";position:absolute;left:50%;top:0;height:100%;width:2px;background:var(--line);transform:translateX(-1px)}
  .staff-left{width:50%;display:flex;justify-content:flex-end;align-items:center}
  .audit{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px dashed var(--gold);color:var(--gold);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:800;background:rgba(217,178,90,.07);white-space:nowrap}
  .audit small{font-size:9px;color:var(--muted);font-weight:600}
  .hconn{position:relative;width:24px;height:2px;background:var(--line);flex:none}
  .hconn::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:0;height:0;border:5px solid transparent;border-right-color:var(--line)}

  .hq{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .hq-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-left:5px solid var(--accent)}
  .hq.c1 .hq-head{border-left-color:var(--c1)}
  .hq.c2 .hq-head{border-left-color:var(--c2)}
  .hq.c3 .hq-head{border-left-color:var(--c3)}
  .hq-head .name{font-size:16px;font-weight:800}
  .hq-head .tag{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
  .hq-body{padding:6px 16px 16px;min-height:18px}

  .branch{position:relative;margin:12px 0 0 8px;padding-left:20px;border-left:2px solid var(--line)}
  .branch:last-child{border-left-color:transparent}
  .branch::before{content:"";position:absolute;left:0;top:18px;width:18px;height:2px;background:var(--line)}
  .branch:last-child::after{content:"";position:absolute;left:0;top:0;width:2px;height:18px;background:var(--line)}
  .unit{background:var(--panel2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .unit.tftbox{border-color:var(--tft)}
  .unit.tftbox .unit-head{color:var(--tft-ink)}
  .unit.tftbox .ic{background:var(--tft)!important}
  .unit-head{display:flex;align-items:center;gap:8px;padding:10px 13px;font-weight:700;font-size:13.5px;flex-wrap:wrap}
  .unit-head .ic{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .c1 .unit-head .ic{background:var(--c1)} .c2 .unit-head .ic{background:var(--c2)} .c3 .unit-head .ic{background:var(--c3)}
  .unit-head .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  .leaves{padding:2px 13px 11px;display:flex;flex-wrap:wrap;gap:6px}
  .leaf{background:var(--leaf-bg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12px;color:var(--leaf-ink);font-weight:500;white-space:nowrap}
  .leaf.team{font-weight:700;color:var(--ink);border-color:var(--team-bd)}
  .leaf.import{border-color:var(--import-bd);color:var(--import);background:var(--import-bg)}
  .leaf.smart{border-color:var(--smart-bd);color:var(--smart);background:var(--smart-bg)}
  .leafwrap{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .lw-label{font-size:11px;color:var(--muted);font-weight:700;margin-right:4px}
  .support{display:inline-flex;align-items:center;gap:7px;margin:12px 0 0 8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:700}
  .support::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--muted)}
  .c2 .support::before{background:var(--c2)} .c3 .support::before{background:var(--c3)}

  .has-spec{border-color:var(--auto)!important;box-shadow:0 0 0 2px rgba(192,57,43,.16)}
  .spec{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:var(--auto);border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:middle}

  [data-id]{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
  [data-id]:active{filter:brightness(1.12)}
  .sel{outline:3px solid var(--ink)!important;outline-offset:1px;box-shadow:0 0 0 5px rgba(79,140,255,.4)!important}
  .target-ok{outline:2px dashed var(--new)!important;outline-offset:2px;background:rgba(46,204,113,.09)}
  .target-ok::after{content:"여기로";position:absolute;top:-9px;right:6px;font-size:9px;font-weight:800;color:#08301c;background:var(--new);border-radius:5px;padding:1px 6px;z-index:2}

  .chg-new{border-color:var(--new)!important;box-shadow:0 0 0 2px rgba(46,204,113,.18)}
  .chg-new .ic{background:var(--new)!important}
  .chg-closed{opacity:.55;border-style:dashed!important;border-color:var(--closed)!important}
  .chg-closed .u-name,.chg-closed .lname{text-decoration:line-through}
  .chg-moved{border-color:var(--moved)!important;box-shadow:0 0 0 2px rgba(79,140,255,.16)}
  .chg-renamed{border-color:var(--renamed)!important}
  .chg-promoted{border-color:var(--promoted)!important;box-shadow:0 0 0 2px rgba(157,132,232,.18)}
  .chg-promoted .ic{background:var(--promoted)!important}
  .chg-demoted{border-color:var(--demoted)!important;box-shadow:0 0 0 2px rgba(230,126,34,.18)}
  .chg-demoted .ic{background:var(--demoted)!important}
  .chg-merged{opacity:.6;border-style:dashed!important;border-color:var(--merged)!important}
  .chg-merged .u-name,.chg-merged .lname{text-decoration:line-through;text-decoration-thickness:2px}
  /* 개편된 조직 테두리 두껍게 */
  .chg-new,.chg-closed,.chg-moved,.chg-renamed,.chg-promoted,.chg-demoted,.chg-merged,.chg-combined{border-width:3px!important}

  .bdg{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.3px;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:middle}
  .bdg.new{background:var(--new);color:#08301c} .bdg.closed{background:var(--closed);color:#fff}
  .bdg.moved{background:var(--moved);color:#fff} .bdg.renamed{background:var(--renamed);color:#3a2708}
  .bdg.promoted{background:var(--promoted);color:#1a123a} .bdg.merged{background:var(--merged);color:#06241f}
  .bdg.demoted{background:var(--demoted);color:#3a2708}
  .bdg.mtgt{background:var(--merged);color:#06241f}
  .bdg.combined{background:var(--combined);color:#06241f}
  .has-merge{border-color:var(--combined)!important;border-width:3px!important;box-shadow:0 0 0 2px rgba(26,188,156,.2)}
  .mtarget{border-color:var(--merged)!important;border-width:3px!important;box-shadow:0 0 0 2px rgba(26,188,156,.18)}
  .hq.mtarget{box-shadow:inset 4px 0 0 var(--merged)}
  .old{color:var(--muted);text-decoration:line-through;font-weight:500;font-size:11px;margin-left:6px}

  .legend{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin:20px 0 4px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(128,128,128,.25)}

  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(150%);bottom:14px;width:min(620px,calc(100% - 20px));
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 -6px 40px rgba(0,0,0,.35);padding:12px 14px;z-index:55;transition:transform .2s ease}
  .sheet.on{transform:translateX(-50%) translateY(0)}
  .sheet .st-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .sheet .st-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .st-kind{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
  .sheet .st-x{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:20px;font-weight:800;cursor:pointer;padding:0 4px}
  .sheet .st-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sheet .sb{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:11px 4px;font-size:11.5px;font-weight:700;cursor:pointer;min-height:56px;justify-content:center;text-align:center}
  .sheet .sb:active{transform:translateY(1px)}
  .sheet .sb .e{font-size:18px;line-height:1}
  .sheet .sb.danger{color:#e06a6a;border-color:#7a4247} .sheet .sb.good{color:#3bbd7e;border-color:#2c5a44} .sheet .sb.spec{color:var(--auto);border-color:var(--auto)}
  @media (max-width:520px){ .sheet .st-btns{grid-template-columns:repeat(3,1fr)} }

  .overlay{position:fixed;inset:0;background:rgba(5,8,14,.66);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:600px;width:100%;max-height:82vh;overflow:auto;padding:22px 22px}
  .modal h2{margin:0 0 14px;font-size:17px}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-weight:800;font-size:18px}
  .txtin{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:16px;padding:12px;outline:none;margin-bottom:14px;font-family:inherit}
  .txtin:focus{border-color:var(--accent)}
  .mbtns{display:flex;gap:8px;justify-content:flex-end}
  .choices{display:flex;flex-direction:column;gap:9px}
  .choices .choice{padding:14px;font-size:15px;text-align:center;border-radius:11px}
  .sumgrid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .sumgrid .k{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700}
  .sumlist{display:flex;flex-direction:column;gap:6px}
  .sumrow{display:flex;gap:10px;align-items:baseline;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .sumrow .path{color:var(--muted);font-size:11.5px}
  .empty{color:var(--muted);font-style:italic;padding:8px 0}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;background:#0b1220;border:1px solid #2c374d;color:#e8ecf4;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:90;pointer-events:none;transition:.22s;max-width:90%}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="toolbar">
  <div class="row">
    <div class="brand">조직개편 캔버스</div>
    <button class="vtab on" data-v="0">v1</button>
    <button class="vtab" data-v="1">v2</button>
    <button class="vtab" data-v="2">v3</button>
    <button class="vtab" data-v="3">v4</button>
    <span class="spacer"></span>
    <button class="btn" data-act="theme">☀️ 화이트</button>
  </div>
  <div class="row">
    <button class="btn" data-act="undo">↩ 취소</button>
    <button class="btn" data-act="summary">📋 요약</button>
    <button class="btn accent" data-act="prompt">📝 프롬프트 저장</button>
    <button class="btn" data-act="savefile">💾 작업저장</button>
    <button class="btn" data-act="loadfile">📂 불러오기</button>
    <button class="btn" data-act="export">🧩 JSON</button>
    <button class="btn" data-act="print">🖨 인쇄</button>
    <span class="spacer"></span>
    <button class="btn" data-act="reset">⟳ 초기화</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  <div class="help" id="help"><b>조직을 탭</b>하면 아래 버튼이 나옵니다. 이동/통합은 버튼 누른 뒤 <b>대상을 탭</b>. 상단 v1~v4로 여러 버전을 따로 작업하세요.</div>
</div>

<div class="wrap">
  <div id="stats" class="stats"></div>
  <div id="canvas"></div>
  <div class="legend">
    <span><i style="background:var(--tft)"></i>TFT(부서·센터 사이)</span>
    <span><i style="background:var(--new)"></i>신설</span>
    <span><i style="background:var(--closed)"></i>폐쇄</span>
    <span><i style="background:var(--merged)"></i>통합</span>
    <span><i style="background:var(--moved)"></i>이동</span>
    <span><i style="background:var(--renamed)"></i>명칭변경</span>
    <span><i style="background:var(--promoted)"></i>승격</span>
    <span><i style="background:var(--demoted)"></i>강등</span>
    <span><i style="background:var(--auto)"></i>특화업무</span>
    <span style="margin-left:10px"><i style="background:var(--import)"></i>외제</span>
    <span><i style="background:var(--smart)"></i>SMART</span>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="st-top">
    <span class="st-name" id="shName">조직</span>
    <span class="st-kind" id="shKind"></span>
    <button class="st-x" id="shClose">✕</button>
  </div>
  <div class="st-btns" id="shBtns"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════ 초기 데이터 ═══════ */
function team(n){ return {name:n, kind:'leaf', flags:['team'], children:[]}; }
function part(n,t){ return {name:n, kind:'unit', flags:[], children:t.map(team)}; }
function support(n){ return {name:n, kind:'unit', flags:['support'], children:[]}; }
function tftOrg(n){ return {name:n, kind:'tft', flags:[], children:[]}; }
function centers(arr){ return arr.map(function(x){ var f=[]; if(x.indexOf('외제')===0)f.push('import'); if(/^SMART/.test(x))f.push('smart'); var o={name:x,kind:'leaf',flags:f,children:[]}; if(x==='SMART강남')o.special='자동화전담'; return o; }); }
function bu(n,arr){ return {name:n, kind:'unit', flags:[], children:centers(arr)}; }

var INITIAL={ name:'대표이사', kind:'ceo', flags:[], children:[
  {name:'감사파트', kind:'audit', flags:[], children:[]},
  {name:'경영지원본부', kind:'hq', color:'c1', flags:[], children:[
    part('손사지원파트',['인사교육팀','총무경리팀']),
    part('손사전략파트',['업무지원팀','기회통계팀','QI팀']),
    tftOrg('네트워크운영TFT'),
    tftOrg('업무TFT')
  ]},
  {name:'수도권보상본부', kind:'hq', color:'c2', flags:[], children:[
    support('수도본부지원팀'),
    bu('강북차량보상부',['의정부','노원','성동','동대문','서대문','일산','외제일산','외제강북']),
    bu('강남차량보상부',['강남','강서','영등포','구로','제주','외제강남','외제강서']),
    bu('동서울차량보상부',['구리','강동','성남','춘천','원주','이천','강릉','외제강동']),

  ]},
  {name:'지방보상본부', kind:'hq', color:'c3', flags:[], children:[
    support('지방본부지원팀'),

    bu('대구차량보상부',['남대구','동대구','서대구','북대구','포항','구미','안동','외제대구']),
    bu('충청차량보상부',['동대전','서대전','세종','충주','청주','천안','홍성','외제충청']),
    bu('호남차량보상부',['동광주','서광주','전주','군산','순천','목포','외제호남']),
    bu('지방SMART차량보상부',['SMART부산','SMART대구','SMART충청','SMART호남'])

]};

/* ═══════ 상태 (v1~v4) ═══════ */
var DKEY='orgCanvasVersions_v5', TKEY='orgCanvasTheme';
var VERS=['v1','v2','v3','v4'];
var data, cur=0, tree, undoStack, selectedId=null, pending=null, idMap={}, parentMap={}, idSeq=0;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mkWs(){ return {tree:clone(INITIAL), undo:[]}; }
function saveData(){ try{ localStorage.setItem(DKEY, JSON.stringify({versions:data.versions, cur:cur})); }catch(e){} }
function loadData(){ try{ var s=localStorage.getItem(DKEY); if(s) return JSON.parse(s); }catch(e){} return null; }
function pushHistory(){ undoStack.push(clone(tree)); if(undoStack.length>60) undoStack.shift(); }
function setTree(t){ tree=t; data.versions[cur].tree=t; }

function ensureIds(){ idMap={}; parentMap={}; (function w(n,pid){ if(!n.id) n.id='n'+(++idSeq); idMap[n.id]=n; parentMap[n.id]=pid; (n.children||[]).forEach(function(c){ w(c,n.id); }); })(tree,null); }

function init(){
  var d=loadData();
  data = d && d.versions && d.versions.length===4 ? {versions:d.versions} : {versions:[mkWs(),mkWs(),mkWs(),mkWs()]};
  cur = d && typeof d.cur==='number' ? d.cur : 0;
  idSeq=0; data.versions.forEach(function(ws){ (function w(n){ if(n.id){ var m=/^n(\d+)$/.exec(n.id); if(m) idSeq=Math.max(idSeq,+m[1]); } if(typeof n.change==='string'){ if(n.change!=='combined'&&n.change!=='merged'){ n.changes=n.changes||[]; if(n.changes.indexOf(n.change)<0) n.changes.push(n.change); } delete n.change; } (n.children||[]).forEach(w); })(ws.tree); });
  applyTheme(localStorage.getItem(TKEY)||'dark');
  activate(cur);
}
function activate(i){
  cur=i; var ws=data.versions[i]; tree=ws.tree; undoStack=ws.undo=ws.undo||[];
  selectedId=null; pending=null; resetHelp(); hideSheet(); ensureIds(); render(); updateTabs();
}

/* ═══════ 유틸 ═══════ */
function findParent(id){ return idMap[parentMap[id]]||null; }
function isDescendant(node, ancId){ var p=parentMap[node.id]; while(p){ if(p===ancId) return true; p=parentMap[p]; } return false; }
function removeFromParent(node){ var par=findParent(node.id); if(par) par.children=par.children.filter(function(c){return c.id!==node.id;}); }
function nearestHqAncestor(id){ var p=parentMap[id]; while(p){ var n=idMap[p]; if(n&&n.kind==='hq') return n; p=parentMap[p]; } return null; }
function firstHq(){ return tree.children.filter(function(c){return c.kind==='hq';})[0]||tree; }
function pathNames(id){ var a=[],p=parentMap[id]; while(p){ var n=idMap[p]; if(!n)break; if(n.kind!=='ceo')a.unshift(n.name); p=parentMap[p]; } return a; }
var KIND_LABEL={ceo:'대표이사',audit:'직속',hq:'본부',unit:'부서',tft:'TFT',leaf:'팀/센터'};
function canParent(childKind, parentNode){ if(!parentNode) return false; var ok={leaf:['unit','tft','hq'], tft:['unit','hq'], unit:['hq','ceo'], hq:['ceo'], audit:['ceo']}[childKind]||[]; return ok.indexOf(parentNode.kind)>=0; }

/* ═══════ 변경 태그(복수) ═══════ */
var CHG_LABEL={new:'신설',closed:'폐쇄',moved:'이동',renamed:'명칭변경',promoted:'승격',demoted:'강등'};
var CHG_ORDER=['new','promoted','demoted','moved','renamed','closed'];
function hasChg(n,t){ return n.changes && n.changes.indexOf(t)>=0; }
function addChange(n,t){ n.changes=n.changes||[]; if(n.changes.indexOf(t)<0) n.changes.push(t); }
function rmChange(n,t){ if(n.changes) n.changes=n.changes.filter(function(x){return x!==t;}); }

/* ═══════ 렌더 ═══════ */
function chgClass(n){ if(!n.changes||!n.changes.length) return ''; for(var i=0;i<CHG_ORDER.length;i++){ if(hasChg(n,CHG_ORDER[i])) return ' chg-'+CHG_ORDER[i]; } return ''; }
function chgBadge(n){ if(!n.changes||!n.changes.length) return ''; var out=''; CHG_ORDER.forEach(function(t){ if(hasChg(n,t)) out+=' <span class="bdg '+t+'">'+CHG_LABEL[t]+'</span>'; }); return out; }
function specBadge(n){ return n.special?' <span class="spec">'+esc(n.special)+'</span>':''; }
function mtClass(n){ return (n.mergedParts&&n.mergedParts.length)?' has-merge':''; }
function mfBadge(n){ return (n.mergedParts&&n.mergedParts.length)?' <span class="bdg combined">통합: '+esc(n.mergedParts.join(' · '))+'</span>':''; }
function oldName(n){ return n.oldName?'<span class="old">'+esc(n.oldName)+'</span>':''; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function renderLeaf(n){
  var cls='leaf'+(n.flags.indexOf('team')>=0?' team':'')+(n.flags.indexOf('import')>=0?' import':'')+(n.flags.indexOf('smart')>=0?' smart':'')+(n.special?' has-spec':'')+mtClass(n)+chgClass(n);
  return '<span class="'+cls+'" data-id="'+n.id+'" data-kind="leaf"><span class="lname">'+esc(n.name)+'</span>'+oldName(n)+specBadge(n)+chgBadge(n)+mfBadge(n)+'</span>';
}
function supportHtml(n){ return '<div class="support'+(n.special?' has-spec':'')+mtClass(n)+chgClass(n)+'" data-id="'+n.id+'" data-kind="unit"><span class="u-name">'+esc(n.name)+'</span>'+oldName(n)+specBadge(n)+chgBadge(n)+mfBadge(n)+'</div>'; }
function renderUnitLike(n){
  if(n.kind==='unit'&&n.flags.indexOf('support')>=0) return supportHtml(n);
  var kids=n.children||[];
  var leaves=kids.filter(function(c){return c.kind==='leaf';});
  var subs=kids.filter(function(c){return c.kind==='unit'||c.kind==='tft';});
  var cnt=leaves.filter(function(c){return !hasChg(c,'closed');}).length;
  var cntHtml=cnt>0?'<span class="cnt">'+cnt+'</span>':'';
  var box='unit'+(n.kind==='tft'?' tftbox':'')+(n.special?' has-spec':'')+mtClass(n)+chgClass(n);
  var h='<div class="branch"><div class="'+box+'" data-id="'+n.id+'" data-kind="'+n.kind+'">'
    +'<div class="unit-head"><span class="ic"></span><span class="u-name">'+esc(n.name)+'</span>'+oldName(n)+specBadge(n)+chgBadge(n)+mfBadge(n)+cntHtml+'</div>';
  if(leaves.length) h+='<div class="leaves">'+leaves.map(renderLeaf).join('')+'</div>';
  h+='</div>';
  if(subs.length) h+='<div style="margin-left:6px">'+subs.map(renderUnitLike).join('')+'</div>';
  h+='</div>';
  return h;
}
function renderHQ(n){
  var kids=n.children||[];
  var sup=kids.filter(function(c){return c.kind==='unit'&&c.flags.indexOf('support')>=0;});
  var org=kids.filter(function(c){return (c.kind==='unit'&&c.flags.indexOf('support')<0)||c.kind==='tft';});
  var leaves=kids.filter(function(c){return c.kind==='leaf';});
  var uc=kids.filter(function(c){return c.kind==='unit'&&c.flags.indexOf('support')<0&&!hasChg(c,'closed');}).length;
  var tc=kids.filter(function(c){return c.kind==='tft'&&!hasChg(c,'closed');}).length;
  var cc=0;(function co(nd){(nd.children||[]).forEach(function(c){ if(c.kind==='leaf'&&c.flags.indexOf('team')<0&&!hasChg(c,'closed'))cc++; co(c);});})(n);
  var tp=[]; if(uc)tp.push('부서 '+uc); if(tc)tp.push('TFT '+tc); if(cc)tp.push('센터 '+cc);
  var tag=tp.join(' · ');
  var h='<section class="hq '+(n.color||'c1')+mtClass(n)+'"><div class="hq-head" data-id="'+n.id+'" data-kind="hq">'
    +'<span class="name u-name">'+esc(n.name)+'</span>'+oldName(n)+specBadge(n)+chgBadge(n)+mfBadge(n)+(tag?'<span class="tag">'+tag+'</span>':'')+'</div><div class="hq-body">';
  h+=sup.map(supportHtml).join('')+org.map(renderUnitLike).join('');
  if(leaves.length) h+='<div class="branch"><div class="leafwrap"><span class="lw-label">본부 직속</span>'+leaves.map(renderLeaf).join('')+'</div></div>';
  h+='</div></section>';
  return h;
}
function render(){
  ensureIds();
  var audit=(tree.children||[]).filter(function(c){return c.kind==='audit';});
  var hqs=(tree.children||[]).filter(function(c){return c.kind==='hq';});
  var other=(tree.children||[]).filter(function(c){return c.kind!=='audit'&&c.kind!=='hq';});
  var auditHtml=audit.map(function(a){ return '<div class="audit'+chgClass(a)+'" data-id="'+a.id+'" data-kind="audit"><b class="u-name">'+esc(a.name)+'</b><small>대표이사 직속</small>'+oldName(a)+specBadge(a)+chgBadge(a)+'</div>'; }).join('');
  var h='<div class="ceo-area"><div class="ceo'+chgClass(tree)+'" data-id="'+tree.id+'" data-kind="ceo">'+esc(tree.name)+oldName(tree)+chgBadge(tree)+'<small>CEO</small></div></div>';
  h+='<div class="rail"></div>';
  if(auditHtml) h+='<div class="staff"><div class="staff-left">'+auditHtml+'<span class="hconn"></span></div></div>';
  h+='<div class="hqcols">'+hqs.map(function(nd){ return '<div class="hqcol">'+renderHQ(nd)+'</div>'; }).join('')+'</div>';
  if(other.length) h+=other.map(renderUnitLike).join('');
  document.getElementById('canvas').innerHTML=h;
  if(selectedId&&idMap[selectedId]){ var el=document.querySelector('[data-id="'+selectedId+'"]'); if(el) el.classList.add('sel'); }
  if(pending) highlightTargets();
  renderStats(); saveData(); updateTabs();
}
function computeStats(root){
  var s={hq:0,unit:0,tft:0,center:0,team:0,support:0};
  (function w(n){ (n.children||[]).forEach(function(c){
    if(hasChg(c,'closed')) return;
    if(c.kind==='hq') s.hq++;
    else if(c.kind==='tft') s.tft++;
    else if(c.kind==='unit'){ if(c.flags&&c.flags.indexOf('support')>=0) s.support++; else s.unit++; }
    else if(c.kind==='leaf'){ if(c.flags&&c.flags.indexOf('team')>=0) s.team++; else s.center++; }
    w(c);
  }); })(root);
  return s;
}
function renderStats(){
  var a=computeStats(tree), o=computeStats(INITIAL);
  function cell(label,cur,orig){ var d=cur-orig; var dd=d?' <span class="'+(d>0?'up':'dn')+'">('+(d>0?'+':'')+d+')</span>':''; return '<span class="cell">'+label+'<span class="v">'+cur+'</span>'+dd+'</span>'; }
  document.getElementById('stats').innerHTML='<div class="t">개편 후 조직 수 · '+VERS[cur]+'</div><div class="row">'
    +cell('본부',a.hq,o.hq)+cell('부서',a.unit,o.unit)+cell('TFT',a.tft,o.tft)+cell('센터',a.center,o.center)+cell('팀',a.team,o.team)+'</div>';
}
function highlightTargets(){
  var src=idMap[pending.srcId]; if(!src) return;
  document.querySelectorAll('[data-id]').forEach(function(el){
    var n=idMap[el.getAttribute('data-id')]; if(!n||n.id===src.id) return;
    if(isDescendant(n,src.id)) return;
    var ok = pending.type==='move' ? canParent(src.kind,n) : (n.kind===src.kind);
    if(ok) el.classList.add('target-ok');
  });
}

/* ═══════ 탭(노드) 클릭 ═══════ */
document.getElementById('canvas').addEventListener('click', function(e){
  var el=e.target.closest('[data-id]');
  if(pending){ if(el){ completePending(el.getAttribute('data-id')); } else { cancelPending(); } return; }
  if(!el){ selectedId=null; hideSheet(); render(); return; }
  selectedId=el.getAttribute('data-id'); render(); openSheet(selectedId);
});

/* ═══════ 액션 시트 ═══════ */
function openSheet(id){
  var n=idMap[id]; if(!n) return;
  document.getElementById('shName').textContent=n.name;
  document.getElementById('shKind').textContent=KIND_LABEL[n.kind]||'';
  var canAdd=({ceo:1,hq:1,unit:1,tft:1})[n.kind];
  var canPromote=({leaf:1,tft:1})[n.kind];
  var canDemote=({unit:1,tft:1})[n.kind];
  var canMerge=({hq:1,unit:1,tft:1,leaf:1})[n.kind];
  var canMove=(n.kind!=='ceo');
  var canSpec=(n.kind!=='ceo'&&n.kind!=='audit');
  var canAttr=(n.kind==='leaf');
  var closed=hasChg(n,'closed');
  var b='';
  if(canAdd) b+='<button class="sb good" data-m="add"><span class="e">➕</span>하위 신설</button>';
  b+='<button class="sb" data-m="rename"><span class="e">✏️</span>명칭변경</button>';
  if(canPromote) b+='<button class="sb" data-m="promote"><span class="e">⬆</span>승격</button>';
  if(canDemote) b+='<button class="sb" data-m="demote"><span class="e">⬇</span>강등</button>';
  if(canMove) b+='<button class="sb" data-m="move"><span class="e">↕</span>이동</button>';
  if(canMerge) b+='<button class="sb" data-m="merge"><span class="e">🔗</span>통합</button>';
  if(canAttr) b+='<button class="sb" data-m="attr"><span class="e">🏷</span>국산/외산</button>';
  if(canSpec) b+='<button class="sb spec" data-m="special"><span class="e">⭐</span>'+(n.special?'특화해제':'특화지정')+'</button>';
  if(n.kind!=='ceo') b+= closed ? '<button class="sb good" data-m="restore"><span class="e">♻</span>폐쇄취소</button>' : '<button class="sb danger" data-m="close"><span class="e">⛔</span>폐쇄</button>';
  document.getElementById('shBtns').innerHTML=b;
  document.getElementById('sheet').classList.add('on');
}
function hideSheet(){ document.getElementById('sheet').classList.remove('on'); }
document.getElementById('shClose').addEventListener('click', function(){ hideSheet(); selectedId=null; render(); });
document.getElementById('shBtns').addEventListener('click', function(e){
  var b=e.target.closest('[data-m]'); if(!b) return;
  var m=b.getAttribute('data-m'), sel=idMap[selectedId]; if(!sel) return;
  hideSheet();
  if(m==='add') return actAdd(sel);
  if(m==='rename') return actRename(sel);
  if(m==='promote') return actPromote(sel);
  if(m==='demote') return actDemote(sel);
  if(m==='close') return actClose(sel,true);
  if(m==='restore') return actClose(sel,false);
  if(m==='special') return actSpecial(sel);
  if(m==='attr') return actAttr(sel);
  if(m==='move') return startPending('move', sel);
  if(m==='merge') return startPending('merge', sel);
});

/* ═══════ 액션 ═══════ */
function addOptions(kind){ return {ceo:['hq'], hq:['unit','tft','leaf'], unit:['tft','leaf'], tft:['leaf'], leaf:[]}[kind]||[]; }
function actAdd(sel){
  var opts=addOptions(sel.kind);
  if(!opts.length){ toast('하위에 신설할 수 없습니다.'); return; }
  if(opts.length===1) return promptAddName(sel, opts[0]);
  askChoice('"'+sel.name+'" 하위에 신설할 레벨을 선택하세요', opts.map(function(k){return {kind:k,label:KIND_LABEL[k]};}), function(k){ promptAddName(sel,k); });
}
function promptAddName(sel, kind){
  askText('신설할 '+KIND_LABEL[kind]+' 이름', '', function(name){
    if(!name) return;
    pushHistory();
    var c={name:name,kind:kind,flags:[],children:[],changes:['new'],id:'n'+(++idSeq)};
    if(kind==='hq') c.color='c1';
    if(kind==='leaf'&&sel.kind==='unit'&&sel.name.indexOf('파트')>=0) c.flags.push('team');
    sel.children.push(c); selectedId=c.id; render(); openSheet(c.id); toast(KIND_LABEL[kind]+' 신설됨');
  });
}
function actRename(sel){
  askText('새 명칭', sel.name, function(name){
    if(!name||name===sel.name) return;
    pushHistory();
    if(!hasChg(sel,'new')){ if(!sel.oldName) sel.oldName=sel.name; addChange(sel,'renamed'); }
    sel.name=name;
    render(); openSheet(sel.id); toast('명칭이 변경되었습니다');
  });
}
var RANK={leaf:0,tft:1,unit:2,hq:3};
function promoteLevels(kind){ return {leaf:['tft','unit'], tft:['unit']}[kind]||[]; }
function demoteLevels(kind){ return {unit:['tft','leaf'], tft:['leaf']}[kind]||[]; }
function actPromote(sel){
  var lv=promoteLevels(sel.kind); if(!lv.length){ toast('부서 레벨까지만 승격됩니다.'); return; }
  askLevelName('승격', sel, lv, function(k,nm){ applyLevelChange(sel,k,nm,'승격'); });
}
function actDemote(sel){
  var lv=demoteLevels(sel.kind); if(!lv.length){ toast('더 내릴 수 없습니다.'); return; }
  askLevelName('강등', sel, lv, function(k,nm){ applyLevelChange(sel,k,nm,'강등'); });
}
function applyLevelChange(sel, kind, name, word){
  if(kind==='leaf' && (sel.children||[]).some(function(c){return !hasChg(c,'closed');})){ toast('하위 조직이 있어 팀/센터로 내릴 수 없습니다.'); return; }
  pushHistory();
  var isNew=hasChg(sel,'new');
  if(!isNew && sel.oldKind==null) sel.oldKind=sel.kind;
  sel.kind=kind;
  if(kind==='unit'||kind==='hq') sel.flags=sel.flags.filter(function(f){return f!=='team';});
  if(kind==='hq'&&!sel.color) sel.color='c1';
  var par=findParent(sel.id);
  if(!canParent(kind,par)){ removeFromParent(sel); (nearestHqAncestor(sel.id)||firstHq()).children.push(sel); }
  if(name && name!==sel.name){ if(!isNew){ if(!sel.oldName) sel.oldName=sel.name; addChange(sel,'renamed'); } sel.name=name; }
  if(!isNew){
    rmChange(sel,'promoted'); rmChange(sel,'demoted');
    if(sel.oldKind!=null){ if(RANK[kind]>RANK[sel.oldKind]) addChange(sel,'promoted'); else if(RANK[kind]<RANK[sel.oldKind]) addChange(sel,'demoted'); else delete sel.oldKind; }
  }
  ensureIds(); selectedId=sel.id; render(); openSheet(sel.id); toast(word+'되었습니다 ('+KIND_LABEL[kind]+')');
}
function actAttr(sel){
  askChoice('속성 선택 (국산 / 외산)', [{kind:'dom',label:'국산'},{kind:'imp',label:'외산 (외제·노란색)'}], function(k){
    pushHistory();
    sel.flags=sel.flags.filter(function(f){return f!=='import';});
    if(k==='imp') sel.flags.push('import');
    render(); openSheet(sel.id); toast(k==='imp'?'외산으로 지정':'국산으로 지정');
  });
}
function actClose(sel, close){
  pushHistory();
  if(close){ addChange(sel,'closed'); toast('폐쇄 표시'); }
  else { rmChange(sel,'closed'); toast('폐쇄 취소'); }
  render();
}
function actSpecial(sel){
  askText('특화업무명 (비우면 해제 · 예: 자동화전담)', sel.special||'', function(v){
    pushHistory();
    if(!v){ delete sel.special; toast('특화 해제'); } else { sel.special=v; toast('특화 지정: '+v); }
    render(); openSheet(sel.id);
  });
}

/* ── 이동/통합 ── */
function startPending(type, sel){
  pending={type:type, srcId:sel.id};
  var help=document.getElementById('help'); help.className='help mode';
  help.innerHTML = type==='move'
    ? '<b>이동</b> — "'+esc(sel.name)+'" 을 옮길 상위 조직을 탭 (초록 표시 / 취소: 빈 곳 탭)'
    : '<b>통합</b> — "'+esc(sel.name)+'"(으)로 <b>흡수할</b> 조직을 탭하세요. 탭한 조직이 "'+esc(sel.name)+'"에 합쳐지며 빗금 처리됩니다. (취소: 빈 곳 탭)';
  render();
}
function completePending(id){
  var src=idMap[pending.srcId], t=idMap[id], type=pending.type;
  if(!src||!t||id===src.id){ cancelPending(); return; }
  if(isDescendant(t,src.id)){ toast('하위 조직으로는 할 수 없습니다.'); return; }
  if(type==='move'){
    if(!canParent(src.kind,t)){ toast('그 위치로는 이동할 수 없습니다.'); return; }
    if(parentMap[src.id]===t.id){ cancelPending(); return; }
    pushHistory(); removeFromParent(src); t.children=t.children||[]; t.children.push(src);
    if(!hasChg(src,'new')) addChange(src,'moved'); selectedId=src.id; endPending(); toast('이동되었습니다');
  } else {
    if(t.kind!==src.kind){ toast('같은 종류끼리만 통합할 수 있습니다.'); return; }
    var srcId=src.id, tId=t.id;
    pending=null; resetHelp(); render();
    askText('통합 조직의 이름을 정하세요 (그대로 두려면 유지)', src.name, function(nm){
      var s=idMap[srcId], tt=idMap[tId]; if(!s||!tt) return;
      pushHistory();
      (tt.children||[]).forEach(function(c){ if(!hasChg(c,'closed')){ if(!hasChg(c,'new')) addChange(c,'moved'); s.children.push(c); } });
      var parts = (s.mergedParts&&s.mergedParts.length) ? s.mergedParts.slice() : [s.name];
      parts.push(tt.name);
      removeFromParent(tt);          // 흡수된 조직은 화면에서 제거
      s.mergedParts=parts;           // 통합 정보는 change와 별개로 유지(이동해도 안 사라짐)
      if(nm && nm!==s.name) s.name=nm;
      ensureIds(); selectedId=s.id; render(); openSheet(s.id); toast('통합되었습니다: '+parts.join(' + '));
    });
    return;
  }
}
function endPending(){ pending=null; resetHelp(); render(); }
function cancelPending(){ pending=null; resetHelp(); selectedId=null; render(); }
function resetHelp(){ var help=document.getElementById('help'); help.className='help'; help.innerHTML='<b>조직을 탭</b>하면 아래 버튼이 나옵니다. 이동/통합은 버튼 누른 뒤 <b>대상을 탭</b>. 상단 v1~v4로 여러 버전을 따로 작업하세요.'; }

/* ═══════ 상단 버튼 ═══════ */
document.querySelector('.toolbar').addEventListener('click', function(e){
  var v=e.target.closest('[data-v]'); if(v){ activate(+v.getAttribute('data-v')); return; }
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.getAttribute('data-act');
  if(a==='theme') return toggleTheme();
  if(a==='undo'){ if(!undoStack.length){ toast('되돌릴 작업이 없습니다.'); return; } setTree(undoStack.pop()); ensureIds(); selectedId=null; pending=null; resetHelp(); hideSheet(); render(); toast('실행취소'); return; }
  if(a==='reset'){ askConfirm(VERS[cur]+' 을(를) 원본 조직으로 초기화할까요?', function(){ setTree(clone(INITIAL)); undoStack.length=0; ensureIds(); selectedId=null; pending=null; resetHelp(); hideSheet(); render(); toast(VERS[cur]+' 초기화됨'); }); return; }
  if(a==='summary') return showSummary();
  if(a==='export') return doExport();
  if(a==='prompt') return savePrompt();
  if(a==='savefile') return saveFile();
  if(a==='loadfile'){ document.getElementById('fileIn').click(); return; }
  if(a==='print') return window.print();
});
function saveFile(){
  var payload={ app:'조직개편캔버스', versions:data.versions.map(function(ws){ return {tree:stripIds(ws.tree)}; }) };
  downloadFile('조직개편_작업본.json', JSON.stringify(payload,null,2), 'application/json');
}
function migrateTree(n){
  delete n.id;
  if(typeof n.change==='string'){ if(n.change!=='combined'&&n.change!=='merged'){ n.changes=n.changes||[]; if(n.changes.indexOf(n.change)<0) n.changes.push(n.change); } delete n.change; }
  (n.children||[]).forEach(migrateTree);
}
document.getElementById('fileIn').addEventListener('change', function(e){
  var f=e.target.files&&e.target.files[0]; if(!f){ return; }
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      var vers=obj.versions||obj.savedVersions;
      if(!vers && obj.tree){ vers=[{tree:obj.tree}]; }   // 단일 버전 JSON도 허용
      if(!vers||!vers.length){ toast('올바른 작업 파일이 아닙니다'); return; }
      var newVers=[]; for(var i=0;i<4;i++){ var vt=vers[i]&&vers[i].tree; newVers.push({tree: vt?vt:clone(INITIAL), undo:[]}); }
      data.versions=newVers; cur=0; idSeq=0;
      data.versions.forEach(function(ws){ migrateTree(ws.tree); });
      activate(0); toast('작업을 불러왔습니다');
    }catch(err){ toast('불러오기 실패: 파일을 확인하세요'); }
  };
  r.readAsText(f); e.target.value='';
});
function updateTabs(){
  document.querySelectorAll('.vtab').forEach(function(b){
    var i=+b.getAttribute('data-v'); var t=data.versions[i].tree;
    var c=0;(function w(n){ if((n.changes&&n.changes.length)||(n.mergedParts&&n.mergedParts.length))c++; (n.children||[]).forEach(w); })(t);
    b.classList.toggle('on', i===cur);
    b.innerHTML='v'+(i+1)+(c?' <span class="vc">'+c+'</span>':'');
  });
}

/* ═══════ 테마 ═══════ */
function applyTheme(t){ if(t==='light'){ document.body.classList.add('light'); } else { document.body.classList.remove('light'); } var btn=document.querySelector('[data-act="theme"]'); if(btn) btn.textContent = t==='light'?'🌙 다크':'☀️ 화이트'; }
function toggleTheme(){ var light=document.body.classList.contains('light'); var nt=light?'dark':'light'; applyTheme(nt); try{ localStorage.setItem(TKEY, nt); }catch(e){} }

/* ═══════ 요약 ═══════ */
function changeEntries(){ var out=[]; (function w(n){ (n.changes||[]).forEach(function(t){ out.push({node:n,type:t,path:pathNames(n.id)}); }); (n.children||[]).forEach(w); })(tree); return out; }
function collectSpecial(){ var out=[]; (function w(n){ if(n.special) out.push({node:n,path:pathNames(n.id)}); (n.children||[]).forEach(w); })(tree); return out; }
function collectMerges(){ var out=[]; (function w(n){ if(n.mergedParts&&n.mergedParts.length) out.push({node:n,path:pathNames(n.id)}); (n.children||[]).forEach(w); })(tree); return out; }
function showSummary(){
  var ce=changeEntries(), mg=collectMerges(), sp=collectSpecial(), counts={};
  ce.forEach(function(e){ counts[e.type]=(counts[e.type]||0)+1; });
  var h='<span class="close" onclick="closeModal()">✕</span><h2>📋 '+VERS[cur]+' 변경 요약</h2><div class="sumgrid">';
  CHG_ORDER.forEach(function(k){ h+='<span class="k" style="border-color:var(--'+k+')">'+CHG_LABEL[k]+' '+(counts[k]||0)+'</span>'; });
  h+='<span class="k" style="border-color:var(--combined)">통합 '+mg.length+'</span>';
  h+='<span class="k" style="border-color:var(--auto)">특화 '+sp.length+'</span></div>';
  if(!ce.length&&!mg.length&&!sp.length) h+='<div class="empty">아직 변경 사항이 없습니다.</div>';
  else{
    h+='<div class="sumlist">';
    ce.forEach(function(e){ var n=e.node, ex=''; if(e.type==='renamed'&&n.oldName) ex=' <span class="old">'+esc(n.oldName)+'</span> → '+esc(n.name); else if((e.type==='promoted'||e.type==='demoted')&&n.oldKind) ex=' : '+KIND_LABEL[n.oldKind]+' → '+KIND_LABEL[n.kind]; h+='<div class="sumrow"><span class="bdg '+e.type+'">'+CHG_LABEL[e.type]+'</span><span><b>'+esc(n.name)+'</b>'+ex+'<div class="path">'+(e.path.join(' › ')||'최상위')+'</div></span></div>'; });
    mg.forEach(function(c){ h+='<div class="sumrow"><span class="bdg combined">통합</span><span><b>'+esc(c.node.name)+'</b> : '+esc(c.node.mergedParts.join(' + '))+'<div class="path">'+(c.path.join(' › ')||'')+'</div></span></div>'; });
    sp.forEach(function(c){ h+='<div class="sumrow"><span class="spec">특화</span><span><b>'+esc(c.node.name)+'</b> : '+esc(c.node.special)+'<div class="path">'+(c.path.join(' › ')||'')+'</div></span></div>'; });
    h+='</div>';
  }
  openModal(h);
}

/* ═══════ 저장 (JSON / 프롬프트) ═══════ */
function stripIds(n){ var o={name:n.name,kind:n.kind,flags:n.flags||[]}; if(n.color)o.color=n.color; if(n.changes&&n.changes.length)o.changes=n.changes; if(n.oldName)o.oldName=n.oldName; if(n.oldKind)o.oldKind=n.oldKind; if(n.mergedParts)o.mergedParts=n.mergedParts; if(n.special)o.special=n.special; o.children=(n.children||[]).map(stripIds); return o; }
function downloadFile(fname, content, mime){
  try{ var blob=new Blob([content],{type:mime}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },100); toast('저장: '+fname); }
  catch(e){ openModal('<span class="close" onclick="closeModal()">✕</span><h2>'+esc(fname)+' (복사해서 사용)</h2><textarea class="txtin" style="height:320px">'+esc(content)+'</textarea>'); }
}
function doExport(){
  var d={exportedFrom:'조직개편 캔버스', version:VERS[cur], tree:stripIds(tree), changes:changeEntries().map(function(e){ return {type:e.type,name:e.node.name,path:e.path}; }), merges:collectMerges().map(function(c){ return {name:c.node.name,parts:c.node.mergedParts,path:c.path}; })};
  downloadFile('조직개편_'+VERS[cur]+'.json', JSON.stringify(d,null,2), 'application/json');
}
function treeText(node, skipClosed){
  var lines=[];
  (function w(n,d){
    if(skipClosed && hasChg(n,'closed')) return;
    var tags=[]; if(n.flags&&n.flags.indexOf('import')>=0)tags.push('외제'); if(n.flags&&n.flags.indexOf('smart')>=0)tags.push('SMART'); if(n.special)tags.push('특화:'+n.special); if(n.mergedParts&&n.mergedParts.length)tags.push('통합:'+n.mergedParts.join('+'));
    var lv=KIND_LABEL[n.kind]; var t=tags.length?' ['+tags.join(', ')+']':'';
    lines.push(Array(d+1).join('  ')+'- '+n.name+' ('+lv+')'+t);
    (n.children||[]).forEach(function(c){ w(c,d+1); });
  })(node,0);
  return lines.join('\n');
}
function changesText(){
  var ce=changeEntries(), mg=collectMerges(); if(!ce.length && !mg.length) return '(구조 변경 없음)';
  var lines=ce.map(function(e){ var n=e.node, ex=''; if(e.type==='renamed'&&n.oldName) ex=' : '+n.oldName+' → '+n.name; else if((e.type==='promoted'||e.type==='demoted')&&n.oldKind) ex=' : '+KIND_LABEL[n.oldKind]+' → '+KIND_LABEL[n.kind]; var p=e.path.length?'  ('+e.path.join(' › ')+')':''; return '- ['+CHG_LABEL[e.type]+'] '+n.name+ex+p; });
  mg.forEach(function(c){ var p=c.path.length?'  ('+c.path.join(' › ')+')':''; lines.push('- [통합] '+c.node.name+' : '+c.node.mergedParts.join(' + ')+' 통합'+p); });
  return lines.join('\n');
}
function specialText(){ var sp=collectSpecial(); if(!sp.length) return '(없음)'; return sp.map(function(c){ return '- '+c.node.name+' : '+c.node.special+'  ('+c.path.join(' › ')+')'; }).join('\n'); }
function savePrompt(){
  var v=VERS[cur];
  var md=''
    +'# 조직개편 작업 요청 ('+v+')\n\n'
    +'아래는 조직개편 캔버스(오프라인 편집기)로 작업한 '+v+' 결과입니다.\n'
    +'이 내용을 바탕으로 다음 3가지를 정리한 오프라인 HTML 자료를 만들어 주세요.\n'
    +'1) 현재(개편 전) 조직도\n2) 개편 내역 및 설명\n3) 개편 후 조직도\n\n'
    +'- 조직 레벨: 대표이사 > 본부 > 부서(파트/부) > TFT(부서·센터 사이) > 팀/센터\n'
    +'- "특화"는 자동화전담처럼 해당 조직에 부여된 특화업무를 뜻합니다.\n\n'
    +'---\n\n## 1. 현재(개편 전) 조직도\n\n'+treeText(INITIAL,false)+'\n\n'
    +'## 2. 개편 내역\n\n'+changesText()+'\n\n'
    +'### 특화업무 현황\n\n'+specialText()+'\n\n'
    +'## 3. 개편 후 조직도 (폐쇄·통합 제외, 변경 반영)\n\n'+treeText(tree,true)+'\n';
  downloadFile('조직개편_'+v+'_프롬프트.md', md, 'text/markdown');
}

/* ═══════ 공통 UI ═══════ */
function openModal(h){ document.getElementById('modalBody').innerHTML=h; document.getElementById('overlay').classList.add('on'); }
function closeModal(){ document.getElementById('overlay').classList.remove('on'); }
function askText(title, def, cb){
  var h='<span class="close" onclick="closeModal()">✕</span><h2>'+esc(title)+'</h2><input id="txtIn" class="txtin" type="text" value="'+esc(def||'')+'" autocomplete="off"><div class="mbtns"><button class="btn" id="cancelBtn">취소</button><button class="btn pri" id="okBtn">확인</button></div>';
  openModal(h);
  var inp=document.getElementById('txtIn'); setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} },40);
  function done(){ var val=(inp.value||'').trim(); closeModal(); cb(val); }
  document.getElementById('okBtn').onclick=done;
  document.getElementById('cancelBtn').onclick=function(){ closeModal(); };
  inp.onkeydown=function(e){ if(e.key==='Enter') done(); };
}
function askChoice(title, options, cb){
  var h='<span class="close" onclick="closeModal()">✕</span><h2>'+esc(title)+'</h2><div class="choices">';
  options.forEach(function(o){ h+='<button class="btn choice" data-k="'+o.kind+'">'+esc(o.label)+'</button>'; });
  h+='</div>';
  openModal(h);
  document.querySelectorAll('#modalBody .choice').forEach(function(btn){ btn.onclick=function(){ var k=btn.getAttribute('data-k'); closeModal(); cb(k); }; });
}
function askLevelName(word, node, levels, cb){
  var h='<span class="close" onclick="closeModal()">✕</span><h2>'+esc(word)+' — 레벨과 이름 설정</h2>'
    +'<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px">이름 (그대로 두려면 유지)</div>'
    +'<input id="txtIn" class="txtin" type="text" value="'+esc(node.name)+'" autocomplete="off">'
    +'<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px">'+esc(word)+'할 레벨 (누르면 적용)</div>'
    +'<div class="choices">'+levels.map(function(k){ return '<button class="btn choice" data-k="'+k+'">'+KIND_LABEL[k]+'로 '+esc(word)+'</button>'; }).join('')+'</div>'
    +'<div class="mbtns" style="margin-top:12px"><button class="btn" id="cancelBtn">취소</button></div>';
  openModal(h);
  var inp=document.getElementById('txtIn'); setTimeout(function(){ try{ inp.focus(); }catch(e){} },40);
  document.querySelectorAll('#modalBody .choice').forEach(function(btn){ btn.onclick=function(){ var k=btn.getAttribute('data-k'); var nm=(inp.value||'').trim(); closeModal(); cb(k, nm); }; });
  document.getElementById('cancelBtn').onclick=function(){ closeModal(); };
}
function askConfirm(msg, cb){
  openModal('<h2>'+esc(msg)+'</h2><div class="mbtns"><button class="btn" id="noBtn">취소</button><button class="btn pri" id="yesBtn">확인</button></div>');
  document.getElementById('yesBtn').onclick=function(){ closeModal(); cb(); };
  document.getElementById('noBtn').onclick=function(){ closeModal(); };
}
var toastTimer;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); },1700); }

document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeModal(); if(pending) cancelPending(); else hideSheet(); } });

init();
</script>
</body>
